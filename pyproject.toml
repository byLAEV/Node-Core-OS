[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "node-core-os"
version = "0.1.0"
description = "Node infrastructure for local and decentralized resources."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
node-core = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["node_core*"]
