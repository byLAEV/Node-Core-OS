name: Node Core OS — User-only Kubo network integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user-only-network-integration:
    name: Two-node Kubo transfer and signed-receipt tests (non-root)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      KUBO_VERSION: "0.42.0"
      TEST_ROOT: ${{ github.workspace }}/.node-core-user-only-network

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce ordinary-user execution
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -z "${SUDO_USER:-}"
          printf 'runner_uid=%s\n' "$(id -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: all following test commands execute as a non-root user."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project Python dependencies
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test user-only helper and Ed25519 receipt validation
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python -m unittest discover -s tests -p 'test_termux_remote_kubo_read.py' -v

      - name: Download pinned Kubo and configure isolated user-owned nodes
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          mkdir -p "$TEST_ROOT/source" "$TEST_ROOT/receiver" "$TEST_ROOT/bin"
          archive="$TEST_ROOT/kubo.tar.gz"
          downloaded=false
          for url in \
            "https://dist.ipfs.tech/kubo/v${KUBO_VERSION}/kubo_v${KUBO_VERSION}_linux-amd64.tar.gz" \
            "https://github.com/ipfs/kubo/releases/download/v${KUBO_VERSION}/kubo_v${KUBO_VERSION}_linux-amd64.tar.gz"; do
            if curl --fail --location --silent --show-error --connect-timeout 20 --max-time 180 \
              --retry 3 --retry-all-errors --retry-delay 2 "$url" --output "$archive"; then
              downloaded=true
              break
            fi
            rm -f "$archive"
          done
          test "$downloaded" = true || { echo "Unable to download official Kubo v${KUBO_VERSION}." >&2; exit 1; }
          tar -xzf "$archive" -C "$TEST_ROOT/bin"
          IPFS_BIN="$TEST_ROOT/bin/kubo/ipfs"
          test -x "$IPFS_BIN"
          "$IPFS_BIN" version

          export IPFS_PATH="$TEST_ROOT/source"
          "$IPFS_BIN" init --profile=test
          "$IPFS_BIN" config --json Addresses.API '"/ip4/127.0.0.1/tcp/5001"'
          "$IPFS_BIN" config --json Addresses.Gateway '"/ip4/127.0.0.1/tcp/8080"'
          "$IPFS_BIN" config --json Addresses.Swarm '["/ip4/127.0.0.1/tcp/4001"]'
          "$IPFS_BIN" config --json Bootstrap '[]'
          "$IPFS_BIN" config --json Discovery.MDNS.Enabled false

          export IPFS_PATH="$TEST_ROOT/receiver"
          "$IPFS_BIN" init --profile=test
          "$IPFS_BIN" config --json Addresses.API '"/ip4/127.0.0.1/tcp/5002"'
          "$IPFS_BIN" config --json Addresses.Gateway '"/ip4/127.0.0.1/tcp/8081"'
          "$IPFS_BIN" config --json Addresses.Swarm '["/ip4/127.0.0.1/tcp/4002"]'
          "$IPFS_BIN" config --json Bootstrap '[]'
          "$IPFS_BIN" config --json Discovery.MDNS.Enabled false

          echo "IPFS_BIN=$IPFS_BIN" >> "$GITHUB_ENV"
          echo "TEST_ROOT=$TEST_ROOT" >> "$GITHUB_ENV"
          echo "PASS: both Kubo repositories were initialized as the ordinary runner user."

      - name: Start isolated source and receiver Kubo daemons
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          export IPFS_PATH="$TEST_ROOT/source"
          nohup "$IPFS_BIN" daemon > "$TEST_ROOT/source-daemon.log" 2>&1 </dev/null &
          echo "$!" > "$TEST_ROOT/source-daemon.pid"
          export IPFS_PATH="$TEST_ROOT/receiver"
          nohup "$IPFS_BIN" daemon > "$TEST_ROOT/receiver-daemon.log" 2>&1 </dev/null &
          echo "$!" > "$TEST_ROOT/receiver-daemon.pid"

          for port in 5001 5002; do
            ready=false
            for attempt in $(seq 1 90); do
              if curl --fail --silent --max-time 2 -X POST "http://127.0.0.1:$port/api/v0/id" >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 1
            done
            if [[ "$ready" != true ]]; then
              cat "$TEST_ROOT/source-daemon.log" "$TEST_ROOT/receiver-daemon.log" >&2
              echo "Kubo API on port $port did not become ready." >&2
              exit 1
            fi
          done
          echo "PASS: both local Kubo daemons are running without root."

      - name: Transfer synthetic content between independent Kubo nodes
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          printf '%s\n' 'Node Core OS user-only network integration fixture.' \
            'Synthetic data only; no identity secrets or personal information.' \
            > "$TEST_ROOT/source-fixture.txt"
          expected_sha256="$(sha256sum "$TEST_ROOT/source-fixture.txt" | cut -d' ' -f1)"

          export IPFS_PATH="$TEST_ROOT/source"
          cid="$("$IPFS_BIN" add -Q "$TEST_ROOT/source-fixture.txt")"
          peer_id="$("$IPFS_BIN" id -f='<id>')"
          peer_address="/ip4/127.0.0.1/tcp/4001/p2p/$peer_id"

          export IPFS_PATH="$TEST_ROOT/receiver"
          connected=false
          for attempt in $(seq 1 45); do
            if "$IPFS_BIN" swarm connect "$peer_address"; then
              connected=true
              break
            fi
            sleep 1
          done
          test "$connected" = true || {
            cat "$TEST_ROOT/source-daemon.log" "$TEST_ROOT/receiver-daemon.log" >&2
            echo "Receiver could not establish a libp2p connection to the source." >&2
            exit 1
          }

          "$IPFS_BIN" cat "$cid" > "$TEST_ROOT/received-fixture.txt"
          actual_sha256="$(sha256sum "$TEST_ROOT/received-fixture.txt" | cut -d' ' -f1)"
          test "$actual_sha256" = "$expected_sha256"
          cmp "$TEST_ROOT/source-fixture.txt" "$TEST_ROOT/received-fixture.txt"

          {
            echo
            echo "## User-only network integration: PASS"
            echo
            echo "- Runner UID: $(id -u) (must be non-zero)"
            echo "- Kubo version: $("$IPFS_BIN" version --number)"
            echo "- Source peer ID: $peer_id"
            echo "- Synthetic CID: $cid"
            echo "- Source SHA-256: $expected_sha256"
            echo "- Receiver SHA-256: $actual_sha256"
            echo "- Result: receiver connected to an independent local Kubo node and retrieved byte-identical content."
            echo "- Receipt signature contract: covered by the passing Ed25519 helper unit tests above."
            echo "- Device limitation: this CI job validates user-only network transport on the runner; it does not claim a physical Android/Termux device participated."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: remote CID retrieved and SHA-256 verified between independent Kubo nodes."

      - name: Stop test daemons
        if: always()
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          for pid_file in "$TEST_ROOT/source-daemon.pid" "$TEST_ROOT/receiver-daemon.pid"; do
            if [[ -f "$pid_file" ]]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
          echo "Temporary user-owned Kubo daemons stopped."
