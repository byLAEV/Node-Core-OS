name: Node Core OS — Two Kubo Nodes Integration

on:
  push:
    branches:
      - main
      - feat/github-pages-node-binding
    paths:
      - ".github/workflows/two-node-network.yml"
      - "installer/tests/two-kubo-nodes.sh"
      - "node_core/network.py"
      - "tests/test_network.py"
      - "node_core/record_replication.py"
      - "tests/test_github_record_replication.py"
  pull_request:
    branches:
      - main
      - feat/bios-functional-menus-packaging
    paths:
      - ".github/workflows/two-node-network.yml"
      - "installer/tests/two-kubo-nodes.sh"
      - "node_core/network.py"
      - "tests/test_network.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-kubo-nodes:
    name: Two independent Kubo nodes communicate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBO_VERSION: "0.42.0"
    steps:
      - name: Enforce non-root execution
        shell: bash
        run: |
          set -eu
          test "$(id -u)" -ne 0 || { echo "ERROR: this job must not run as root (UID 0)." >&2; exit 1; }
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify test utilities are available without privilege escalation
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v curl
          command -v tar

      - name: Validate integration test shell syntax
        run: |
          set -euo pipefail
          bash -n installer/tests/two-kubo-nodes.sh

      - name: Start two isolated Kubo nodes and verify peer communication
        run: |
          set -euo pipefail
          bash installer/tests/two-kubo-nodes.sh
