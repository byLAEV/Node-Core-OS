name: Node Core OS — Shield Comparative Lab

on:
  pull_request:
    branches: [main]
    paths:
      - 'node_core/security/**'
      - 'node_core/identity/**'
      - 'tests/test_shield_*.py'
      - 'tests/test_distributed_defense.py'
      - 'docs/shield/COMPARATIVE-GITHUB-ACTIONS-PLAN.md'
      - '.github/workflows/shield-comparative-lab.yml'
  push:
    branches: [main]
    paths:
      - 'node_core/security/**'
      - 'node_core/identity/**'
      - 'tests/test_shield_*.py'
      - 'tests/test_distributed_defense.py'
      - 'docs/shield/COMPARATIVE-GITHUB-ACTIONS-PLAN.md'
      - '.github/workflows/shield-comparative-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    name: Stage 0 — security regression (not an A/B benchmark)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Enforce ordinary-user execution
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -n "$HOME"
          test -w "$HOME"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Shield and identity regression tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_shield_support.py' -v
          python -m unittest discover -s tests -p 'test_shield_identity_credential.py' -v
          python -m unittest discover -s tests -p 'test_shield_web_attack_lab.py' -v
          python -m unittest discover -s tests -p 'test_shield_distributed_alert_acceptance.py' -v
          python -m unittest discover -s tests -p 'test_distributed_defense.py' -v
          python -m unittest discover -s tests -p 'test_api_abuse_lab.py' -v
          python -m unittest discover -s tests -p 'test_p2p_tls_transport.py' -v
          python -m compileall -q node_core/security node_core/identity tests

      - name: Validate plan and report current scope
        if: always()
        run: |
          set -euo pipefail
          test -s docs/shield/COMPARATIVE-GITHUB-ACTIONS-PLAN.md
          {
            echo '## Shield comparative campaign status'
            echo
            echo '- Stage 0: security regression tests were requested by this workflow.'
            echo '- Stages 1–5: professional WAF fixture, paired A/B attack corpus, performance runs and comparative metrics are not implemented by this workflow yet.'
            echo '- Comparative verdict: **NOT RUN / NOT COMPARABLE**.'
            echo '- This workflow does not scan public infrastructure and does not test volumetric DDoS.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-comparative-stage0-${{ github.sha }}
          path: docs/shield/COMPARATIVE-GITHUB-ACTIONS-PLAN.md
          if-no-files-found: error
          retention-days: 30