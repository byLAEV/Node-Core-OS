name: HashPaper — Live OpenTimestamps Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: read

jobs:
  live-opentimestamps:
    name: Submit synthetic document to the official OpenTimestamps client
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official OpenTimestamps client
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install opentimestamps-client
          ots --help

      - name: Create synthetic document and submit a real timestamp
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hashpaper-ots-live"
          original="$RUNNER_TEMP/hashpaper-ots-live/synthetic-document.md"
          stamp_report="$RUNNER_TEMP/hashpaper-ots-live/stamp-report.json"
          check_report="$RUNNER_TEMP/hashpaper-ots-live/check-report.json"

          python3 applications/hashpaper/main.py create \
            --output "$original" \
            --title "Synthetic HashPaper live OpenTimestamps test" \
            --text "Synthetic content only. This document contains no personal data."

          before="$(sha256sum "$original" | awk '{print $1}')"
          python3 applications/hashpaper/main.py stamp \
            --input "$original" \
            --report "$stamp_report"
          test -s "$original.ots"
          after="$(sha256sum "$original" | awk '{print $1}')"
          test "$before" = "$after"

          python3 applications/hashpaper/main.py check \
            --input "$original" \
            --report "$check_report"

          python3 - "$original" "$stamp_report" "$check_report" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          original = Path(sys.argv[1])
          stamp_report = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          check_report = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          digest = hashlib.sha256(original.read_bytes()).hexdigest()
          assert stamp_report["original_sha256"] == digest
          assert check_report["original_sha256"] == digest
          assert stamp_report["proof_file"] == str(Path(str(original) + ".ots"))
          assert Path(stamp_report["proof_file"]).is_file()
          assert check_report["status"] in {
              "VERIFIED",
              "WAITING_FOR_BITCOIN",
              "NETWORK_ERROR",
              "NOT_CHECKED",
              "PROOF_ERROR",
          }
          print(f"Original SHA-256 preserved: {digest}")
          print(f"Timestamp submission status: {stamp_report['status']}")
          print(f"Immediate proof check status: {check_report['status']}")
          if check_report["status"] != "VERIFIED":
              print("No Bitcoin attestation verification is claimed by this run.")
          PY

      - name: Upload synthetic OpenTimestamps evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hashpaper-live-opentimestamps-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hashpaper-ots-live/
          if-no-files-found: warn
          retention-days: 7
