name: Node Core OS — CDD Security Lab

on:
  pull_request:
    branches: [main]
    paths:
      - "node_core/security/cdd.py"
      - "node_core/security/cdd_intent.py"
      - "node_core/security/cdd_gateway.py"
      - "node_core/security/cdd_router.py"
      - "node_core/ipfs.py"
      - "tests/test_cdd_security.py"
      - "tests/test_cdd_intent.py"
      - "tests/test_cdd_gateway.py"
      - "tests/test_cdd_router.py"
      - "tests/test_cdd_integration.py"
      - "docs/CDD-DISTRIBUTED-DEFENSE.md"
      - ".github/workflows/cdd-security-lab.yml"
      - "node_core/identity/node_identity.py"
  push:
    branches: [main]
    paths:
      - "node_core/security/cdd.py"
      - "node_core/security/cdd_gateway.py"
      - "node_core/security/cdd_router.py"
      - "node_core/ipfs.py"
      - "tests/test_cdd_security.py"
      - "tests/test_cdd_gateway.py"
      - "tests/test_cdd_router.py"
      - "tests/test_cdd_integration.py"
      - "docs/CDD-DISTRIBUTED-DEFENSE.md"
      - ".github/workflows/cdd-security-lab.yml"
      - "node_core/identity/node_identity.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdd-security-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdd-local-primitives:
    name: Signed policy, Kubo adapter and local HTTP gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Enforce ordinary-user execution
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -n "$HOME"
          test -w "$HOME"

      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared project dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile CDD implementation and tests
        run: |
          set -euo pipefail
          python -m py_compile node_core/security/cdd.py node_core/security/cdd_intent.py node_core/security/cdd_gateway.py node_core/security/cdd_router.py tests/test_cdd_security.py tests/test_cdd_gateway.py tests/test_cdd_router.py tests/test_cdd_integration.py

      - name: Run CDD security and gateway tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_cdd_security.py' -v
          python -m unittest discover -s tests -p 'test_cdd_intent.py' -v
          python -m unittest discover -s tests -p 'test_cdd_gateway.py' -v
          python -m unittest discover -s tests -p 'test_cdd_router.py' -v
          python -m unittest discover -s tests -p 'test_cdd_integration.py' -v

      - name: Publish accurate scope and limitations
        if: always()
        run: |
          {
            echo "## CDD Security Lab"
            echo "- Tests signed policy validation, bounded local rate limiting, opaque single-use intent tickets, Kubo adapter behavior, and a local-only HTTP gateway."
            echo "- Gateway integration tests use synthetic identities and loopback-only origin/gateway servers."
            echo "- Does not prove production DDoS resistance, global quotas, P2P ingress/failover, DNS/Anycast, or origin firewall isolation."
            echo "- Kubo adapter tests use a fake Kubo object; real Kubo interoperability remains a separate integration test."
            echo "- Multi-gateway integration uses three independent loopback HTTP listeners and repeated latency/availability measurements."
            echo "- Shared quota test injects one in-process limiter into all gateway handlers; cross-process/distributed coordination is not yet implemented."
            echo "- Integration policy CID tests use a deterministic fake Kubo adapter; real Kubo daemon interoperability remains separate."
            echo "- No public target or external attack traffic is used."
            echo "- A skipped or unexecuted test is not a passing test."
          } >> "$GITHUB_STEP_SUMMARY"
