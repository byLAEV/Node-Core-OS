name: Node Identity Certificate Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "node_core/security/node_identity_certificate.py"
      - "tests/test_node_identity_certificate.py"
      - "schemas/node-core-node-identity-certificate.schema.json"
      - ".github/workflows/node-identity-certificate.yml"
  push:
    branches: [main]
    paths:
      - "node_core/security/node_identity_certificate.py"
      - "tests/test_node_identity_certificate.py"
      - "schemas/node-core-node-identity-certificate.schema.json"
      - ".github/workflows/node-identity-certificate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cryptography
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Run certificate conformance tests
        run: python -m pytest -q tests/test_node_identity_certificate.py
