name: Node Core OS — GNU/Linux Terminal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-terminal:
    name: GNU/Linux terminal
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify supported platform
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test -n "${BASH_VERSION}"
          test "$(python -c 'import sys; print(sys.version_info.major)')" = "3"
          test "$(python -c 'import sys; print(sys.version_info.minor)')" = "12"

      - name: Validate Python sources
        run: |
          set -euo pipefail
          python -m compileall -q main.py node_core tests

      - name: Validate installer shell syntax
        run: |
          set -euo pipefail
          bash installer/tests/syntax.sh
          bash installer/tests/user-context.sh
          bash installer/tests/detect-installation.sh
          bash installer/tests/manifest.sh
          bash installer/tests/plan.sh

      - name: Run terminal test suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
