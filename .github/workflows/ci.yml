name: Node Core OS — GNU/Linux Terminal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number used for temporary endpoint coordination
        required: true
        type: number

permissions:
  contents: read

jobs:
  linux-terminal:
    name: GNU/Linux terminal
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify supported platform
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test -n "${BASH_VERSION}"
          test "$(python -c 'import sys; print(sys.version_info.major)')" = "3"
          test "$(python -c 'import sys; print(sys.version_info.minor)')" = "12"

      - name: Validate Python sources
        run: |
          set -euo pipefail
          python -m compileall -q main.py node_core tests applications/hashpaper applications/p2p_contracts

      - name: Validate installer shell syntax
        run: |
          set -euo pipefail
          bash installer/tests/syntax.sh
          bash installer/tests/user-context.sh
          bash installer/tests/detect-installation.sh
          bash installer/tests/manifest.sh
          bash installer/tests/plan.sh
          bash installer/tests/apply.sh
          bash installer/tests/update-preservation.sh
          bash installer/tests/hashpaper-install.sh
          bash installer/tests/kubo-download-sources.sh
          bash installer/tests/termux-update-preservation.sh

      - name: Run terminal test suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Run HashPaper local foundation tests
        run: |
          set -euo pipefail
          python -m unittest discover -s applications/hashpaper/tests -v

      - name: Run P2P Contracts unit tests
        run: |
          set -euo pipefail
          python -m unittest applications.p2p_contracts.tests.test_service applications.p2p_contracts.tests.test_propagation -v

  three-kubo-node-integration:
    name: Three independent Kubo nodes — P2P Contracts end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned Kubo CLI
        run: |
          set -euo pipefail
          if ! curl --fail --location --silent --show-error --connect-timeout 15 --max-time 90 --retry 1 --retry-delay 2 \
            https://dist.ipfs.tech/kubo/v0.32.1/kubo_v0.32.1_linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/kubo.tar.gz"; then
            curl --fail --location --silent --show-error --connect-timeout 15 --max-time 90 \
              https://github.com/ipfs/kubo/releases/download/v0.32.1/kubo_v0.32.1_linux-amd64.tar.gz \
              --output "$RUNNER_TEMP/kubo.tar.gz"
          fi
          mkdir -p "$RUNNER_TEMP/kubo-unpack"
          tar -xzf "$RUNNER_TEMP/kubo.tar.gz" -C "$RUNNER_TEMP/kubo-unpack"
          test -x "$RUNNER_TEMP/kubo-unpack/kubo/ipfs"
          echo "IPFS_BIN=$RUNNER_TEMP/kubo-unpack/kubo/ipfs" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/kubo-unpack/kubo/ipfs" version

      - name: Run three-node real Kubo integration
        run: |
          set -euo pipefail
          python applications/p2p_contracts/tests/three_node_real_kubo.py

  cross-vm-node:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: linux-terminal
    permissions:
      contents: read
      issues: write
      pull-requests: write
    name: Cross-VM P2P node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [node-a, node-b, node-c]
    env:
      HOME: /home/runner/.node-core-cross-vm-${{ matrix.node }}
      NODE_CORE_DATA_DIR: /home/runner/.node-core-cross-vm-${{ matrix.node }}/.node-core
      NODE_CORE_CONFIG: /home/runner/.node-core-cross-vm-${{ matrix.node }}/.node-core/config.json
      NODE_ROLE: ${{ matrix.node }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Node Core OS
        uses: actions/checkout@v4

      - name: Verify this is an independent Ubuntu VM and never root
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = "24.04"
          test "$(uname -s)" = Linux
          test "$(id -u)" -ne 0
          mkdir -p "$HOME"
          printf 'node=%s\nhostname=%s\nuid=%s\n' "$NODE_ROLE" "$(hostname)" "$(id -u)" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate installer shell syntax and reject privileged installation commands
        run: |
          set -euo pipefail
          for script in installer/*.sh installer/lib/*.sh installer/tests/*.sh; do
            bash -n "$script"
          done
          ! grep -R -nE '(^|[[:space:]])(sudo|su|apt-get|dnf|yum|pacman|zypper)([[:space:]]|$)' \
            installer/install.sh installer/lib installer/update.sh installer/uninstall.sh
          chmod +x installer/install.sh installer/uninstall.sh installer/lib/*.sh

      - name: Install Node Core OS and P2P Contracts as ordinary user
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          ./installer/install.sh
          grep -qx '1.3.0' "$NODE_CORE_DATA_DIR/app/VERSION"
          grep -qx '1.0.0' "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/VERSION"
          test -x "$NODE_CORE_DATA_DIR/bin/ipfs"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/tests/three_vm_p2p_contracts.py"
          test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
          test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"

      - name: Configure Kubo for a private local API and tunneled libp2p swarm port
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          IPFS_BIN="$NODE_CORE_DATA_DIR/bin/ipfs"
          "$IPFS_BIN" shutdown || true
          "$IPFS_BIN" config --json Addresses.Swarm '["/ip4/127.0.0.1/tcp/4001"]'
          "$IPFS_BIN" config --json Bootstrap '[]'
          "$IPFS_BIN" config --json Pubsub.Enabled true
          "$IPFS_BIN" config --json Discovery.MDNS.Enabled false
          mkdir -p "$NODE_CORE_DATA_DIR/logs" "$NODE_CORE_DATA_DIR/runtime"
          daemon_args=(daemon)
          if "$IPFS_BIN" daemon --help 2>&1 | grep -q -- '--enable-pubsub-experiment'; then
            daemon_args+=(--enable-pubsub-experiment)
          fi
          nohup "$IPFS_BIN" "${daemon_args[@]}" \
            > "$NODE_CORE_DATA_DIR/logs/kubo-cross-vm.log" 2>&1 </dev/null &
          printf '%s\n' "$!" > "$NODE_CORE_DATA_DIR/runtime/kubo-cross-vm.pid"
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 2 \
              -X POST http://127.0.0.1:5001/api/v0/id >/dev/null 2>&1; then
              "$IPFS_BIN" version
              "$IPFS_BIN" id
              exit 0
            fi
            pid="$(cat "$NODE_CORE_DATA_DIR/runtime/kubo-cross-vm.pid")"
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$NODE_CORE_DATA_DIR/logs/kubo-cross-vm.log" >&2
              exit 1
            fi
            sleep 1
          done
          cat "$NODE_CORE_DATA_DIR/logs/kubo-cross-vm.log" >&2
          exit 1

      - name: Associate distinct synthetic identity with this node's actual Kubo Peer ID
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 - "$NODE_CORE_DATA_DIR/app" "$NODE_ROLE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, sys.argv[1])
          from node_core.runtime import NodeRuntime

          role = sys.argv[2]
          runtime = NodeRuntime()
          runtime.boot()
          peer = runtime.network.identity()
          profile = runtime.identity_profile.save_declared_profile(
              full_name=f"Synthetic Cross-VM Test Person {role.upper()}",
              alias=f"synthetic-{role}",
              nationality="Synthetic",
              issuing_country="ZZ",
              document_type="TEST-ID",
              document_number=f"TEST-{role.upper()}-CROSS-VM",
              birth_date="1990-01-01",
              height_cm=170,
              gender="not-specified",
          )
          profile = runtime.identity_profile.associate_node(peer.peer_id)
          assert profile["identity_status"] == "declared"
          assert profile["node_id"] == peer.peer_id
          path = runtime.identity_profile.profile_path
          assert path.stat().st_uid == os.getuid()
          assert (path.stat().st_mode & 0o077) == 0
          summary = {
              "node": role,
              "peer_id": peer.peer_id,
              "identity_id": profile["identity_id"],
              "identity_status": profile["identity_status"],
              "uid": os.getuid(),
          }
          Path(os.environ["RUNNER_TEMP"], f"{role}-cross-vm-identity.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Download and verify pinned bore TCP tunnel binary
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          archive="$RUNNER_TEMP/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 \
            --max-time 120 \
            'https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            'e484d1e3acba77169b773f31a5bfb34192d4b660f44a094a658a2522cd2270f7' \
            "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bore-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bore-bin"
          test -f "$RUNNER_TEMP/bore-bin/bore"
          chmod +x "$RUNNER_TEMP/bore-bin/bore"
          "$RUNNER_TEMP/bore-bin/bore" --version

      - name: Expose only the Kubo swarm TCP port through a temporary tunnel
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          nohup "$RUNNER_TEMP/bore-bin/bore" local 4001 --local-host 127.0.0.1 --to bore.pub \
            > "$RUNNER_TEMP/bore-cross-vm.log" 2>&1 </dev/null &
          printf '%s\n' "$!" > "$RUNNER_TEMP/bore-cross-vm.pid"
          port=""
          for attempt in $(seq 1 60); do
            port="$(grep -Eo 'bore\.pub:[0-9]+' "$RUNNER_TEMP/bore-cross-vm.log" 2>/dev/null | tail -n 1 | cut -d: -f2 || true)"
            if [[ "$port" =~ ^[0-9]+$ ]]; then
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/bore-cross-vm.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/bore-cross-vm.log" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            cat "$RUNNER_TEMP/bore-cross-vm.log" >&2
            echo "bore.pub did not assign a public TCP port." >&2
            exit 1
          fi
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          peer_id="$("$NODE_CORE_DATA_DIR/bin/ipfs" id -f='<id>')"
          address="/dns4/bore.pub/tcp/$port/p2p/$peer_id"
          printf '%s\n' "$address" > "$RUNNER_TEMP/cross-vm-multiaddr.txt"
          printf 'node=%s\npeer_id=%s\naddress=%s\n' "$NODE_ROLE" "$peer_id" "$address" >> "$GITHUB_STEP_SUMMARY"
          echo "Temporary public swarm address ready for $NODE_ROLE: $address"

      - name: Resolve pull request number for ephemeral endpoint coordination
        run: |
          set -euo pipefail
          pr_number="${PR_NUMBER:-}"
          if [[ -z "$pr_number" ]]; then
            curl --fail --silent --show-error --get \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --data-urlencode "head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
              --data-urlencode "state=open" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls" > "$RUNNER_TEMP/open-pulls.json"
            pr_number="$(python3 - "$RUNNER_TEMP/open-pulls.json" "$GITHUB_REF_NAME" <<'PY'
          import json,sys
          from pathlib import Path
          branch=sys.argv[2]
          pulls=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matches=[item["number"] for item in pulls if item.get("head",{}).get("ref")==branch and item.get("state")=="open"]
          print(matches[0] if len(matches)==1 else "")
          PY
          )"
          fi
          test -n "$pr_number" || { echo "Could not resolve the open PR for branch $GITHUB_REF_NAME." >&2; exit 1; }
          echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"
          echo "Resolved endpoint coordination PR: $pr_number"

      - name: Publish temporary endpoint for this run to the pull request
        run: |
          set -euo pipefail
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          marker="<!-- node-core-p2p-endpoint:${GITHUB_RUN_ID}:${NODE_ROLE} -->"
          peer_id="$("$NODE_CORE_DATA_DIR/bin/ipfs" id -f='<id>')"
          address="$(cat "$RUNNER_TEMP/cross-vm-multiaddr.txt")"
          body="$(printf '%s\nTemporary endpoint for synthetic cross-VM testing only.\nnode=%s\npeer_id=%s\naddress=%s\n' \
            "$marker" "$NODE_ROLE" "$peer_id" "$address")"
          python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' \
            <<< "$body" > "$RUNNER_TEMP/comment-payload.json"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/comment-payload.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments")"
          python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' \
            <<< "$response" > "$RUNNER_TEMP/p2p-endpoint-comment-id.txt"
          echo "Published ephemeral endpoint coordination comment."

      - name: Discover all three endpoints and connect to the other independent Ubuntu nodes
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          comments_url="https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100"
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$comments_url" > "$RUNNER_TEMP/p2p-comments.json"
            if python3 - "$RUNNER_TEMP/p2p-comments.json" "$GITHUB_RUN_ID" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          comments = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          run_id = sys.argv[2]
          wanted = {"node-a", "node-b", "node-c"}
          found = {}
          for comment in comments:
              body = comment.get("body") or ""
              match = re.search(rf"<!-- node-core-p2p-endpoint:{re.escape(run_id)}:(node-[abc]) -->", body)
              if not match:
                  continue
              node = match.group(1)
              address = re.search(r"address=(/dns4/bore\.pub/tcp/[0-9]+/p2p/[A-Za-z0-9]+)", body)
              peer_id = re.search(r"peer_id=([A-Za-z0-9]+)", body)
              if address and peer_id:
                  found[node] = {"node": node, "peer_id": peer_id.group(1), "address": address.group(1)}
          if set(found) == wanted and len({item["peer_id"] for item in found.values()}) == 3:
              Path(sys.argv[1] + ".endpoints.json").write_text(
                  json.dumps([found[node] for node in sorted(found)], indent=2) + "\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              mv "$RUNNER_TEMP/p2p-comments.json.endpoints.json" "$RUNNER_TEMP/cross-vm-endpoints.json"
              break
            fi
            sleep 3
          done
          if [[ ! -s "$RUNNER_TEMP/cross-vm-endpoints.json" ]]; then
            echo "Did not discover all three endpoint comments for workflow run $GITHUB_RUN_ID." >&2
            cat "$RUNNER_TEMP/p2p-comments.json" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/cross-vm-endpoints.json"
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          python3 - "$RUNNER_TEMP/cross-vm-endpoints.json" "$NODE_ROLE" "$NODE_CORE_DATA_DIR/bin/ipfs" <<'PY'
          import json
          import subprocess
          import sys
          import time
          from pathlib import Path

          records = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          role = sys.argv[2]
          ipfs = sys.argv[3]
          for peer in records:
              if peer["node"] == role:
                  continue
              result = subprocess.run(
                  [ipfs, "swarm", "connect", peer["address"]],
                  check=True, capture_output=True, text=True, timeout=30,
              )
              print(f'Connected to {peer["node"]} ({peer["peer_id"]}): {result.stdout.strip()}')
          expected = {peer["peer_id"] for peer in records if peer["node"] != role}
          deadline = time.monotonic() + 75
          connected = set()
          while time.monotonic() < deadline:
              result = subprocess.run([ipfs, "swarm", "peers"], check=True,
                                      capture_output=True, text=True, timeout=10)
              connected = {
                  line.strip().rsplit("/p2p/", 1)[-1]
                  for line in result.stdout.splitlines() if "/p2p/" in line
              }
              if expected.issubset(connected):
                  print(f"{role} has live swarm connections to both independent peers.")
                  break
              time.sleep(1)
          else:
              raise SystemExit(f"{role} could not connect to both peer IDs: expected={expected}, connected={connected}")
          PY

      - name: Run actual cross-VM P2P Contracts request, manifest and evidence scenario
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          cd "$NODE_CORE_DATA_DIR/app"
          python3 applications/p2p_contracts/tests/three_vm_p2p_contracts.py \
            --role "$NODE_ROLE" \
            --peer-file "$RUNNER_TEMP/cross-vm-endpoints.json" \
            --summary "$RUNNER_TEMP/${NODE_ROLE}-cross-vm-summary.json"

      - name: Verify the entire installation remains owned by the ordinary user
        if: always()
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          if [[ -d "$NODE_CORE_DATA_DIR" ]]; then
            test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
            test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"
            if [[ -f "$NODE_CORE_DATA_DIR/identity/profile.json" ]]; then
              test "$(stat -c %a "$NODE_CORE_DATA_DIR/identity/profile.json")" = 600
            fi
          fi

      - name: Upload cross-VM scenario summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.node }}-cross-vm-summary
          path: |
            ${{ runner.temp }}/${{ matrix.node }}-cross-vm-summary.json
            ${{ runner.temp }}/${{ matrix.node }}-cross-vm-identity.json
          if-no-files-found: warn

      - name: Remove endpoint coordination comment and stop user processes
        if: always()
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/p2p-endpoint-comment-id.txt" && -n "${GITHUB_TOKEN:-}" && -n "${PR_NUMBER:-}" ]]; then
            comment_id="$(cat "$RUNNER_TEMP/p2p-endpoint-comment-id.txt")"
            curl --silent --show-error --output /dev/null \
              -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
          fi
          if [[ -f "$RUNNER_TEMP/bore-cross-vm.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/bore-cross-vm.pid")" 2>/dev/null
          fi
          if [[ -x "$NODE_CORE_DATA_DIR/bin/ipfs" ]]; then
            export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
            "$NODE_CORE_DATA_DIR/bin/ipfs" shutdown >/dev/null 2>&1
          fi
          if [[ -f "$NODE_CORE_DATA_DIR/runtime/kubo-cross-vm.pid" ]]; then
            kill "$(cat "$NODE_CORE_DATA_DIR/runtime/kubo-cross-vm.pid")" 2>/dev/null
          fi
          exit 0

  verify-cross-vm-convergence:
    name: Assert three separate VMs converged to the same manifest
    needs: cross-vm-node
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify aggregation job is not root
        run: test "$(id -u)" -ne 0

      - name: Download three node summaries
        uses: actions/download-artifact@v4
        with:
          pattern: node-*-cross-vm-summary
          path: ${{ runner.temp }}/cross-vm-summaries
          merge-multiple: true

      - name: Assert all three nodes converged to the same manifest and evidence
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 - "$RUNNER_TEMP/cross-vm-summaries" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          records = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted(root.glob("*-cross-vm-summary.json"))
          ]
          assert len(records) == 3, f"Expected 3 successful node summaries; found {len(records)}"
          assert {item["node"] for item in records} == {"node-a", "node-b", "node-c"}
          assert len({item["peer_id"] for item in records}) == 3, "Kubo Peer IDs are not unique"
          assert len({item["identity_id"] for item in records}) == 3, "Identity IDs are not unique"
          assert all(item["uid"] != 0 for item in records), "A node ran as root"
          assert all(item["identity_status"] == "declared" for item in records)
          assert all(item["result"] == "PASS" for item in records)
          assert all(item["evidence_verified"] is True for item in records)
          assert all(item["request_status"] == "exchange_completed" for item in records)
          assert all(item["scenario2_evidence_verified"] is True for item in records)
          assert all(item["scenario2_request_status"] == "exchange_completed" for item in records)
          assert len({item["initial_manifest_hash"] for item in records}) == 1, "Initial request manifests differ between VMs"
          assert len({item["final_manifest_hash"] for item in records}) == 1, "Final evidence manifests differ between VMs"
          assert len({item["scenario2_initial_manifest_hash"] for item in records}) == 1, "Scenario 2 request manifests differ between VMs"
          assert len({item["scenario2_final_manifest_hash"] for item in records}) == 1, "Scenario 2 final evidence manifests differ between VMs"
          for item in records:
              expected_peers = {record["peer_id"] for record in records if record["node"] != item["node"]}
              assert expected_peers.issubset(set(item["connected_peer_ids"])), f'{item["node"]} did not connect to both remote nodes'
              print(
                  f'{item["node"]}: peer={item["peer_id"]} '
                  f'round1_initial={item["initial_manifest_hash"]} '
                  f'round1_final={item["final_manifest_hash"]} '
                  f'round2_initial={item["scenario2_initial_manifest_hash"]} '
                  f'round2_final={item["scenario2_final_manifest_hash"]} '
                  f'round2_status={item["scenario2_request_status"]}'
              )
          print("PASS: three separate Ubuntu VMs completed two role-rotated request/manifest/evidence rounds over Kubo PubSub.")
          PY
