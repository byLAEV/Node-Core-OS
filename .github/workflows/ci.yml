name: Node Core OS — GNU/Linux Terminal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-terminal:
    name: GNU/Linux terminal
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify supported platform
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test -n "${BASH_VERSION}"
          test "$(python -c 'import sys; print(sys.version_info.major)')" = "3"
          test "$(python -c 'import sys; print(sys.version_info.minor)')" = "12"

      - name: Validate Python sources
        run: |
          set -euo pipefail
          python -m compileall -q main.py node_core tests applications/hashpaper applications/p2p_contracts

      - name: Validate installer shell syntax
        run: |
          set -euo pipefail
          bash installer/tests/syntax.sh
          bash installer/tests/user-context.sh
          bash installer/tests/detect-installation.sh
          bash installer/tests/manifest.sh
          bash installer/tests/plan.sh
          bash installer/tests/apply.sh
          bash installer/tests/update-preservation.sh
          bash installer/tests/hashpaper-install.sh
          bash installer/tests/kubo-download-sources.sh
          bash installer/tests/termux-update-preservation.sh

      - name: Run terminal test suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Run HashPaper local foundation tests
        run: |
          set -euo pipefail
          python -m unittest discover -s applications/hashpaper/tests -v

      - name: Run P2P Contracts unit tests
        run: |
          set -euo pipefail
          python -m unittest applications.p2p_contracts.tests.test_service applications.p2p_contracts.tests.test_propagation -v

  three-kubo-node-integration:
    name: Three independent Kubo nodes — P2P Contracts end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned Kubo CLI
        run: |
          set -euo pipefail
          if ! curl --fail --location --silent --show-error --connect-timeout 15 --max-time 90 --retry 1 --retry-delay 2 \
            https://dist.ipfs.tech/kubo/v0.32.1/kubo_v0.32.1_linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/kubo.tar.gz"; then
            curl --fail --location --silent --show-error --connect-timeout 15 --max-time 90 \
              https://github.com/ipfs/kubo/releases/download/v0.32.1/kubo_v0.32.1_linux-amd64.tar.gz \
              --output "$RUNNER_TEMP/kubo.tar.gz"
          fi
          mkdir -p "$RUNNER_TEMP/kubo-unpack"
          tar -xzf "$RUNNER_TEMP/kubo.tar.gz" -C "$RUNNER_TEMP/kubo-unpack"
          test -x "$RUNNER_TEMP/kubo-unpack/kubo/ipfs"
          echo "IPFS_BIN=$RUNNER_TEMP/kubo-unpack/kubo/ipfs" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/kubo-unpack/kubo/ipfs" version

      - name: Run three-node real Kubo integration
        run: |
          set -euo pipefail
          python applications/p2p_contracts/tests/three_node_real_kubo.py


  three-independent-p2p-nodes:
    name: Independent Ubuntu 24.04 node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [node-a, node-b, node-c]
    env:
      HOME: ${{ github.workspace }}/.p2p-${{ matrix.node }}-${{ github.run_id }}
      NODE_CORE_DATA_DIR: ${{ github.workspace }}/.p2p-${{ matrix.node }}-${{ github.run_id }}/.node-core
      NODE_CORE_CONFIG: ${{ github.workspace }}/.p2p-${{ matrix.node }}-${{ github.run_id }}/.node-core/config.json
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify separate Ubuntu host and non-root execution
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = "24.04"
          test "$(uname -s)" = Linux
          test "$(id -u)" -ne 0
          mkdir -p "$HOME"
          printf 'Node: %s\nHostname: %s\nUID: %s\n' \
            "${{ matrix.node }}" "$(hostname)" "$(id -u)" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate installer shell and user-only contract
        run: |
          set -euo pipefail
          for script in installer/*.sh installer/lib/*.sh installer/tests/*.sh; do bash -n "$script"; done
          ! grep -R -nE '(^|[[:space:]])(sudo|su|apt-get|dnf|yum|pacman|zypper)([[:space:]]|$)' \
            installer/install.sh installer/lib installer/update.sh installer/uninstall.sh
          chmod +x installer/install.sh installer/uninstall.sh installer/lib/*.sh

      - name: Install Node Core OS and bundled P2P Contracts as user
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          ./installer/install.sh

      - name: Verify release files and user ownership
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          grep -qx '1.3.0' "$NODE_CORE_DATA_DIR/app/VERSION"
          grep -qx '1.0.0' "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/VERSION"
          test -x "$NODE_CORE_DATA_DIR/bin/ipfs"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/main.py"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/p2p_contracts/cli.py"
          test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
          test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"

      - name: Restart Kubo as user in a separate daemon session
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          "$NODE_CORE_DATA_DIR/bin/ipfs" shutdown || true
          mkdir -p "$NODE_CORE_DATA_DIR/logs" "$NODE_CORE_DATA_DIR/runtime"
          nohup "$NODE_CORE_DATA_DIR/bin/ipfs" daemon > "$NODE_CORE_DATA_DIR/logs/kubo-explicit-daemon.log" 2>&1 </dev/null &
          daemon_pid=$!
          printf '%s\n' "$daemon_pid" > "$NODE_CORE_DATA_DIR/runtime/p2p-test-daemon.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 -X POST http://127.0.0.1:5001/api/v0/id >/dev/null 2>&1; then
              "$NODE_CORE_DATA_DIR/bin/ipfs" id
              exit 0
            fi
            if ! kill -0 "$daemon_pid" 2>/dev/null; then cat "$NODE_CORE_DATA_DIR/logs/kubo-explicit-daemon.log" >&2; exit 1; fi
            sleep 1
          done
          cat "$NODE_CORE_DATA_DIR/logs/kubo-explicit-daemon.log" >&2
          exit 1

      - name: Create synthetic identity and associate real Kubo Peer ID
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 - "$NODE_CORE_DATA_DIR/app" "${{ matrix.node }}" <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, sys.argv[1])
          from node_core.runtime import NodeRuntime
          node_name = sys.argv[2]
          runtime = NodeRuntime()
          runtime.boot()
          peer = runtime.network.identity()
          assert peer.peer_id, "Kubo Peer ID missing"
          profile = runtime.identity_profile.save_declared_profile(
              full_name=f"Synthetic Test Person {node_name.upper()}",
              alias=f"synthetic-{node_name}",
              nationality="Synthetic",
              issuing_country="ZZ",
              document_type="TEST-ID",
              document_number=f"TEST-{node_name.upper()}-20261012",
              birth_date="1990-01-01",
              height_cm=170,
              gender="not-specified",
          )
          profile = runtime.identity_profile.associate_node(peer.peer_id)
          assert profile["identity_status"] == "declared" and profile["node_id"] == peer.peer_id
          path = runtime.identity_profile.profile_path
          assert path.stat().st_uid == os.getuid()
          assert path.stat().st_mode & 0o077 == 0
          summary = {
              "node": node_name, "identity_id": profile["identity_id"],
              "peer_id": peer.peer_id, "identity_status": profile["identity_status"],
              "profile_mode": oct(path.stat().st_mode & 0o777), "uid": os.getuid(),
          }
          Path(os.environ["RUNNER_TEMP"], f"{node_name}-identity-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Open P2P Contracts and verify identity-consent gate
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          app="$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/main.py"
          output="$(printf 'y\n0\n' | python3 "$app")"
          printf '%s\n' "$output"
          grep -Fq 'NODE CORE OS — P2P CONTRACTS' <<< "$output"
          grep -Fq 'Do you accept that P2P Contracts may use your existing Node Core OS identity locally?' <<< "$output"
          grep -Fq '1. Create Public Request' <<< "$output"
          grep -Fq '2. Create Private Request (not available yet)' <<< "$output"
          grep -Fq '3. Create Request Closure' <<< "$output"
          grep -Fq '4. Search Request ID' <<< "$output"
          grep -Fq '0. Exit P2P Contracts' <<< "$output"

      - name: Run P2P Contracts unit tests as user
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          cd "$NODE_CORE_DATA_DIR/app"
          python3 -m unittest applications.p2p_contracts.tests.test_service applications.p2p_contracts.tests.test_propagation -v

      - name: Run three-daemon real-Kubo application scenarios as user
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          cd "$NODE_CORE_DATA_DIR/app"
          IPFS_BIN="$NODE_CORE_DATA_DIR/bin/ipfs" python3 applications/p2p_contracts/tests/three_node_real_kubo.py -v

      - name: Verify permissions and upload synthetic node summary
        if: always()
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          if [[ -d "$NODE_CORE_DATA_DIR" ]]; then
            test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
            test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"
            if [[ -f "$NODE_CORE_DATA_DIR/identity/profile.json" ]]; then test "$(stat -c %a "$NODE_CORE_DATA_DIR/identity/profile.json")" = 600; fi
          fi

      - name: Upload synthetic identity summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.node }}-p2p-identity-summary
          path: ${{ runner.temp }}/${{ matrix.node }}-identity-summary.json
          if-no-files-found: warn
