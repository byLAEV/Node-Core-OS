name: Package Node Core OS installers

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/bios-functional-menus-packaging
  # Validation only. Release packaging/publication belongs exclusively to bios-release-packages.yml.

permissions:
  contents: read

jobs:
  package:
    name: Build downloadable installer packages
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce non-root execution
        shell: bash
        run: |
          set -eu
          test "$(id -u)" -ne 0 || { echo "ERROR: this job must not run as root (UID 0)." >&2; exit 1; }
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for platform-specific offline dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and validate versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(tr -d '\r\n' < VERSION)"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            [[ "$tag_version" == "$node_version" ]] || {
              echo "Tag version ($tag_version) does not match VERSION ($node_version)." >&2
              exit 1
            }
          fi
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate installer shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash installer/tests/syntax.sh
          bash installer/tests/user-context.sh
          python -m compileall -q main.py node_core

      - name: Download and verify bundled runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installer/vendor/python-wheels installer/vendor/kubo
          python -m pip download --only-binary=:all: --dest installer/vendor/python-wheels -r requirements.txt
          archive="kubo_v${NODE_CORE_KUBO_VERSION:-0.43.1}_linux-amd64.tar.gz"
          base="https://github.com/ipfs/kubo/releases/download/v${NODE_CORE_KUBO_VERSION:-0.43.1}"
          curl --fail --location --retry 3 --retry-all-errors --output "installer/vendor/kubo/$archive" "$base/$archive"
          curl --fail --location --retry 3 --retry-all-errors --output "installer/vendor/kubo/$archive.sha512" "$base/$archive.sha512"
          (cd installer/vendor/kubo && sha512sum --check "$archive.sha512")
          find installer/vendor/python-wheels -maxdepth 1 -type f -name 'cryptography*.whl' -print -quit | grep -q .
          test -s "installer/vendor/kubo/$archive"

      - name: Build fresh-install source package
        shell: bash
        run: |
          set -euo pipefail
          package="node-core-os-installer-${{ steps.versions.outputs.node }}"
          mkdir -p dist
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          git archive --format=tar --prefix="$package/" HEAD | tar -xf - -C "$stage"
          mkdir -p "$stage/$package/installer/vendor"
          cp -R installer/vendor/. "$stage/$package/installer/vendor/"

          # Suspended applications are retained in Git but excluded from installable packages.
          rm -rf \
            "$stage/$package/applications/hashpaper" \
            "$stage/$package/applications/p2p_contracts" \
            "$stage/$package/installer/hashpaper-install.sh" \
            "$stage/$package/installer/hashpaper-update.sh" \
            "$stage/$package/installer/opentimestamps-server-install.sh" \
            "$stage/$package/installer/tests/hashpaper-install.sh" \
            "$stage/$package/installer/tests/hashpaper-update.sh" \
            "$stage/$package/docs/HASHPAPER.md" \
            "$stage/$package/docs/HASHPAPER-FUNCTIONAL-MANIFEST.md" \
            "$stage/$package/docs/P2P-CONTRACTS-APPLICATION-STRUCTURE.md" \
            "$stage/$package/docs/P2P-CONTRACTS-BTC-REQUEST-PROTOTYPE.md" \
            "$stage/$package/docs/P2P-CONTRACTS-DEVELOPMENT-PLAN.md" \
            "$stage/$package/docs/P2P-CONTRACTS-PUBLIC-MANIFEST-PROTOCOL.md" \
            "$stage/$package/docs/P2P-CONTRACTS-SCHEMAS.md" \
            "$stage/$package/docs/P2P-CONTRACTS-TECHNICAL-AUDIT.md" \
            "$stage/$package/tests/test_hashpaper_storage_layout.py" \
            "$stage/$package/.github/workflows/hashpaper-opentimestamps-live.yml" \
            "$stage/$package/.github/workflows/hashpaper-python-matrix.yml" \
            "$stage/$package/.github/workflows/three-independent-ubuntu-p2p-contracts.yml" \
            "$stage/$package/.github/workflows/three-independent-ubuntu-p2p-e2e.yml"

          tar -czf "dist/$package.tar.gz" -C "$stage" "$package"
          if tar -tzf "dist/$package.tar.gz" | grep -E 'applications/(hashpaper|p2p_contracts)|hashpaper-install|hashpaper-update|opentimestamps-server-install|HASHPAPER|P2P-CONTRACTS|test_hashpaper_storage_layout|hashpaper-opentimestamps-live|hashpaper-python-matrix|three-independent-ubuntu-p2p' >/dev/null; then
            echo 'The Node Core OS source package contains suspended HashPaper or P2P Contracts artifacts.' >&2
            exit 1
          fi
          sha512sum "dist/$package.tar.gz" > "dist/$package.tar.gz.sha512"

      - name: Build existing-install updater package
        shell: bash
        run: |
          set -euo pipefail
          package="node-core-os-updater-${{ steps.versions.outputs.node }}"
          source_package="node-core-os-installer-${{ steps.versions.outputs.node }}.tar.gz"
          mkdir -p "dist/$package"
          cp installer/update.sh "dist/$package/update.sh"
          cp "dist/$source_package" "dist/$package/source-package.tar.gz"
          echo "${{ steps.versions.outputs.commit }}" > "dist/$package/SOURCE_COMMIT"
          cat > "dist/$package/README.txt" <<'EOF'
          Node Core OS self-contained updater package

          This archive contains:
          - update.sh: the protected updater
          - source-package.tar.gz: the exact installation source snapshot and bundled Python wheels
          - SOURCE_COMMIT: the full source commit associated with the archive

          Run as the normal installation user, never as root:
            bash update.sh

          Extract this archive and run the updater from the extracted directory.
          The updater applies the included source package without downloading application source.
          Python dependencies are installed from the included wheelhouse when compatible.
          EOF
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          sha512sum "dist/$package.tar.gz" > "dist/$package.tar.gz.sha512"

      - name: Verify and run self-contained offline updater E2E
        shell: bash
        run: |
          set -euo pipefail
          package="node-core-os-updater-${{ steps.versions.outputs.node }}"
          updater_archive="dist/$package.tar.gz"
          sha512sum --check "$updater_archive.sha512"
          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT
          tar -tzf "$updater_archive" > "$listing"
          grep -q 'update.sh' "$listing"
          grep -q 'source-package.tar.gz' "$listing"
          grep -q 'SOURCE_COMMIT' "$listing"
          bundled_commit="$(tar -xOf "$updater_archive" "$package/SOURCE_COMMIT")"
          [[ "$bundled_commit" == "${{ steps.versions.outputs.commit }}" ]]
          bash installer/tests/offline-updater-e2e.sh "$updater_archive"

      - name: Validate package count without publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name '*.sha512' | wc -l)" -eq 2
          echo "Validation-only workflow: it does not upload artifacts or publish Releases."

      # No release publishing here. The BIOS package workflow is the sole publisher.
