name: Package Node Core OS installers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build downloadable installer packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and validate versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(tr -d '\r\n' < VERSION)"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate installer shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash installer/tests/syntax.sh
          bash installer/tests/user-context.sh
          python -m compileall -q main.py node_core applications/p2p_contracts

      - name: Build fresh-install source package
        shell: bash
        run: |
          set -euo pipefail
          package="node-core-os-installer-${{ steps.versions.outputs.node }}"
          mkdir -p dist
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          git archive --format=tar --prefix="$package/" HEAD | tar -xf - -C "$stage"

          # HashPaper is a separate application and must not ship inside the
          # Node Core OS installer source package.
          rm -rf \
            "$stage/$package/applications/hashpaper" \
            "$stage/$package/installer/hashpaper-install.sh" \
            "$stage/$package/installer/hashpaper-update.sh" \
            "$stage/$package/installer/opentimestamps-server-install.sh" \
            "$stage/$package/installer/tests/hashpaper-install.sh" \
            "$stage/$package/installer/tests/hashpaper-update.sh" \
            "$stage/$package/docs/HASHPAPER.md" \
            "$stage/$package/docs/HASHPAPER-FUNCTIONAL-MANIFEST.md" \
            "$stage/$package/tests/test_hashpaper_storage_layout.py" \
            "$stage/$package/.github/workflows/hashpaper-opentimestamps-live.yml" \
            "$stage/$package/.github/workflows/hashpaper-python-matrix.yml"

          tar -czf "dist/$package.tar.gz" -C "$stage" "$package"
          if tar -tzf "dist/$package.tar.gz" | grep -Eq '(^|/)applications/hashpaper(/|$)|(^|/)installer/hashpaper-(install|update)\.sh$|(^|/)installer/opentimestamps-server-install\.sh$|(^|/)installer/tests/hashpaper-(install|update)\.sh$|(^|/)docs/HASHPAPER(-FUNCTIONAL-MANIFEST)?\.md$|(^|/)tests/test_hashpaper_storage_layout\.py$|(^|/).github/workflows/hashpaper-(opentimestamps-live|python-matrix)\.yml
          sha512sum "dist/$package.tar.gz" > "dist/$package.tar.gz.sha512"

      - name: Build existing-install updater package
        shell: bash
        run: |
          set -euo pipefail
          package="node-core-os-updater-${{ steps.versions.outputs.node }}"
          mkdir -p "dist/$package"
          cp installer/update.sh "dist/$package/"
          cat > "dist/$package/README.txt" <<'EOF'
          Node Core OS updater package

          Run as the normal installation user, never as root:
            bash update.sh

          This package is only for an existing Node Core OS installation.
          It does not perform a fresh installation.
          EOF
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          sha512sum "dist/$package.tar.gz" > "dist/$package.tar.gz.sha512"

      - name: Upload downloadable package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-core-os-installers-${{ steps.versions.outputs.node }}
          path: |
            dist/*.tar.gz
            dist/*.sha512
          if-no-files-found: error
          retention-days: 90

      - name: Publish assets to GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Node Core OS ${{ steps.versions.outputs.node }}" --notes "Node Core OS installer source and existing-install updater packages. SHA-512 checksum files are provided for each archive. The updater is only for existing installations. Automated installer validation targets Ubuntu 24.04 x86_64 GNU/Linux; Termux/Android is not declared supported by this release."
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha512 --clobber
; then
            printf '%s\\n' 'The Node Core OS source package contains a separate HashPaper component.' >&2
            exit 1
          fi
          sha512sum "dist/$package.tar.gz" > "dist/$package.tar.gz.sha512"

      - name: Build existing-install updater package
        shell: bash
        run: |
          set -euo pipefail
          package="node-core-os-updater-${{ steps.versions.outputs.node }}"
          mkdir -p "dist/$package"
          cp installer/update.sh "dist/$package/"
          cat > "dist/$package/README.txt" <<'EOF'
          Node Core OS updater package

          Run as the normal installation user, never as root:
            bash update.sh

          This package is only for an existing Node Core OS installation.
          It does not perform a fresh installation.
          EOF
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          sha512sum "dist/$package.tar.gz" > "dist/$package.tar.gz.sha512"

      - name: Upload downloadable package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-core-os-installers-${{ steps.versions.outputs.node }}
          path: |
            dist/*.tar.gz
            dist/*.sha512
          if-no-files-found: error
          retention-days: 90

      - name: Publish assets to GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Node Core OS ${{ steps.versions.outputs.node }}" --notes "Node Core OS installer source and existing-install updater packages. SHA-512 checksum files are provided for each archive. The updater is only for existing installations. Automated installer validation targets Ubuntu 24.04 x86_64 GNU/Linux; Termux/Android is not declared supported by this release."
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha512 --clobber
