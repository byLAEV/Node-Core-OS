name: Node Core OS — scaled native P2P Linux nodes

on:
  pull_request:
    paths:
      - ".github/workflows/scaled-native-p2p-containers.yml"
      - "ci/linux/three_node_native_p2p.py"
      - "ci/linux/Dockerfile"
  push:
    branches:
      - "feat/real-linux-100-200-node-mesh"
    paths:
      - ".github/workflows/scaled-native-p2p-containers.yml"
      - "ci/linux/three_node_native_p2p.py"
      - "ci/linux/Dockerfile"
  workflow_dispatch:
    inputs:
      node_count:
        description: Number of independent Linux containers to test
        required: true
        type: choice
        options: ["5", "10"]
        default: "5"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate participant Python
        run: python3 -m py_compile ci/linux/three_node_native_p2p.py
      - name: Validate shell scripts
        run: |
          set -euo pipefail
          bash -n ci/linux/run_manual_mesh.sh
          bash -n installer/install.sh
      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/scaled-native-p2p-containers.yml"); puts "YAML_OK"'

  scaled-mesh:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[run-scaled-p2p-5]') || contains(github.event.head_commit.message, '[run-scaled-p2p-10]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NODE_COUNT: ${{ inputs.node_count || (contains(github.event.head_commit.message, '[run-scaled-p2p-10]') && '10') || '5' }}
    steps:
      - name: Checkout Node Core OS
        uses: actions/checkout@v4

      - name: Validate requested scale and runner capacity
        run: |
          set -euo pipefail
          case "$NODE_COUNT" in 5|10) ;; *) echo "::error::Only 5 or 10 nodes are enabled in this stage."; exit 1 ;; esac
          test "$(id -u)" -ne 0
          docker version
          printf 'node_count=%s\n' "$NODE_COUNT" >> "$GITHUB_STEP_SUMMARY"

      - name: Build isolated Linux node image
        run: |
          set -euo pipefail
          docker build --build-arg BASE_IMAGE=ubuntu:24.04 -f ci/linux/Dockerfile -t node-core-scaled-p2p:ubuntu .

      - name: Create private bridge and independent user-owned node volumes
        shell: bash
        run: |
          set -euo pipefail
          docker network create node-core-scaled-p2p
          mkdir -p "$RUNNER_TEMP/scaled-nodes/shared" "$RUNNER_TEMP/scaled-nodes/evidence"
          chmod 700 "$RUNNER_TEMP/scaled-nodes" "$RUNNER_TEMP/scaled-nodes/shared" "$RUNNER_TEMP/scaled-nodes/evidence"
          for ((i=0; i<NODE_COUNT; i++)); do
            label="$(printf 'n%02d' "$i")"
            mkdir -p "$RUNNER_TEMP/scaled-nodes/$label"
            chmod 700 "$RUNNER_TEMP/scaled-nodes/$label"
            docker run -d \
              --name "node-$label" \
              --hostname "node-$label" \
              --network node-core-scaled-p2p \
              --user 1001:1001 \
              -e HOME=/home/nodecore \
              -e NODE_CORE_DATA_DIR=/home/nodecore/.node-core \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$RUNNER_TEMP/scaled-nodes/$label:/home/nodecore/.node-core" \
              -v "$RUNNER_TEMP/scaled-nodes/shared:/shared" \
              node-core-scaled-p2p:ubuntu sleep infinity
          done
          docker ps --filter network=node-core-scaled-p2p --format '{{.Names}} {{.Status}}'

      - name: Install Node Core OS independently in every Linux node
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          for ((i=0; i<NODE_COUNT; i++)); do
            label="$(printf 'n%02d' "$i")"
            (
              docker exec "node-$label" bash -lc '
                set -euo pipefail
                test "$(id -u)" -eq 1001
                cd /workspace
                bash installer/install.sh
                test -x "$NODE_CORE_DATA_DIR/runtime/node-core-venv/bin/python"
                test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
                test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"
              '
            ) > "$RUNNER_TEMP/scaled-nodes/evidence/$label-install.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          if [[ "$failed" -ne 0 ]]; then
            for ((i=0; i<NODE_COUNT; i++)); do
              label="$(printf 'n%02d' "$i")"
              cat "$RUNNER_TEMP/scaled-nodes/evidence/$label-install.log"
            done
            exit 1
          fi
          echo "All $NODE_COUNT user-level installations passed."

      - name: Create unique identities and exchange public trust metadata
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          for ((i=0; i<NODE_COUNT; i++)); do
            label="$(printf 'n%02d' "$i")"
            (
              docker exec "node-$label" bash -lc '
                set -euo pipefail
                "$NODE_CORE_DATA_DIR/runtime/node-core-venv/bin/python" \
                  /workspace/ci/linux/three_node_native_p2p.py prepare '"$label"'
              '
            ) > "$RUNNER_TEMP/scaled-nodes/evidence/$label-prepare.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          test "$failed" -eq 0
          python3 - "$RUNNER_TEMP/scaled-nodes/shared" "$NODE_COUNT" <<'PY'
          import json, sys
          from pathlib import Path
          root, count = Path(sys.argv[1]), int(sys.argv[2])
          files = sorted(root.glob("*.json"))
          nodes = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          assert len(nodes) == count, (len(nodes), count)
          assert len({item["label"] for item in nodes}) == count
          assert len({item["node_id"] for item in nodes}) == count
          print(f"UNIQUE_IDENTITIES_OK nodes={count}")
          for item in nodes:
              print(item["label"], item["node_id"])
          PY

      - name: Start authenticated native Node Core OS P2P listeners
        shell: bash
        run: |
          set -euo pipefail
          for ((i=0; i<NODE_COUNT; i++)); do
            label="$(printf 'n%02d' "$i")"
            docker exec -d "node-$label" bash -lc '
              exec "$NODE_CORE_DATA_DIR/runtime/node-core-venv/bin/python" \
                /workspace/ci/linux/three_node_native_p2p.py serve '"$label"'
            '
          done
          for ((i=0; i<NODE_COUNT; i++)); do
            label="$(printf 'n%02d' "$i")"
            ready=0
            for attempt in {1..45}; do
              if [[ -s "$RUNNER_TEMP/scaled-nodes/shared/$label.ready" ]]; then ready=1; break; fi
              sleep 1
            done
            test "$ready" -eq 1 || { docker logs "node-$label"; exit 1; }
          done
          echo "ALL_P2P_LISTENERS_READY nodes=$NODE_COUNT"

      - name: Verify bidirectional network recognition between every pair
        shell: bash
        run: |
          set -euo pipefail
          total=0
          for ((i=0; i<NODE_COUNT; i++)); do
            source="$(printf 'n%02d' "$i")"
            for ((j=0; j<NODE_COUNT; j++)); do
              [[ "$i" -eq "$j" ]] && continue
              target="$(printf 'n%02d' "$j")"
              docker exec "node-$source" bash -lc '
                "$NODE_CORE_DATA_DIR/runtime/node-core-venv/bin/python" \
                  /workspace/ci/linux/three_node_native_p2p.py probe '"$source"' node-'"$target"'
              ' >> "$RUNNER_TEMP/scaled-nodes/evidence/connectivity.log"
              total=$((total+1))
            done
          done
          expected=$((NODE_COUNT*(NODE_COUNT-1)))
          test "$total" -eq "$expected"
          echo "FULL_MESH_TCP_RECOGNITION_OK directed_links=$total"

      - name: Exchange one unique record from every node to every other node
        shell: bash
        run: |
          set -euo pipefail
          total=0
          for ((i=0; i<NODE_COUNT; i++)); do
            source="$(printf 'n%02d' "$i")"
            for ((j=0; j<NODE_COUNT; j++)); do
              [[ "$i" -eq "$j" ]] && continue
              target="$(printf 'n%02d' "$j")"
              docker exec "node-$source" bash -lc '
                "$NODE_CORE_DATA_DIR/runtime/node-core-venv/bin/python" \
                  /workspace/ci/linux/three_node_native_p2p.py send '"$source"' '"$target"'
              ' >> "$RUNNER_TEMP/scaled-nodes/evidence/delivery.log"
              total=$((total+1))
            done
          done
          expected=$((NODE_COUNT*(NODE_COUNT-1)))
          test "$total" -eq "$expected"
          echo "FULL_MESH_RECORD_EXCHANGE_OK directed_deliveries=$total"

      - name: Verify every received record is persisted exactly once
        shell: bash
        run: |
          set -euo pipefail
          total=0
          for ((i=0; i<NODE_COUNT; i++)); do
            target="$(printf 'n%02d' "$i")"
            for ((j=0; j<NODE_COUNT; j++)); do
              [[ "$i" -eq "$j" ]] && continue
              source="$(printf 'n%02d' "$j")"
              docker exec "node-$target" bash -lc '
                "$NODE_CORE_DATA_DIR/runtime/node-core-venv/bin/python" \
                  /workspace/ci/linux/three_node_native_p2p.py verify '"$target"' '"$source"'
              ' >> "$RUNNER_TEMP/scaled-nodes/evidence/persistence.log"
              total=$((total+1))
            done
          done
          expected=$((NODE_COUNT*(NODE_COUNT-1)))
          test "$total" -eq "$expected"
          echo "FULL_MESH_PERSISTENCE_OK verified_replicas=$total"

      - name: Create campaign summary and preserve node diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scaled-nodes/evidence/container-logs"
          for ((i=0; i<NODE_COUNT; i++)); do
            label="$(printf 'n%02d' "$i")"
            docker logs "node-$label" > "$RUNNER_TEMP/scaled-nodes/evidence/container-logs/$label.log" 2>&1 || true
          done
          python3 - "$RUNNER_TEMP/scaled-nodes/evidence" "$NODE_COUNT" <<'PY'
          import json, sys
          from pathlib import Path
          root, count = Path(sys.argv[1]), int(sys.argv[2])
          result = {
              "node_count": count,
              "expected_directed_links": count * (count - 1),
              "expected_directed_deliveries": count * (count - 1),
              "expected_persistent_replicas": count * (count - 1),
              "evidence_files": sorted(path.name for path in root.iterdir() if path.is_file()),
              "execution_environment": "independent Linux containers on one GitHub-hosted Ubuntu VM",
              "note": "Containers are isolated processes and filesystems, not independent physical or cloud VMs."
          }
          (root / "campaign-summary.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          PY

      - name: Upload scaled Linux mesh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-core-scaled-p2p-${{ inputs.node_count }}-nodes
          path: ${{ runner.temp }}/scaled-nodes/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop all node containers
        if: always()
        run: |
          docker rm -f $(docker ps -aq --filter network=node-core-scaled-p2p) 2>/dev/null || true
          docker network rm node-core-scaled-p2p 2>/dev/null || true
