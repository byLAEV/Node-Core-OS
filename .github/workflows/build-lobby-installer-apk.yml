name: Build NODE Lobby Installer APK
on:
  workflow_dispatch:
  push:
    branches: [feature/termux-lobby-installer-apk]
    paths:
      - 'android/lobby-installer/**'
      - 'termux-lobby/**'
      - '.github/workflows/build-lobby-installer-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android/lobby-installer
        run: |
          gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: node-core-os-lobby-installer-debug
          path: android/lobby-installer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
