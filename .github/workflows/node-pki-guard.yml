name: NODE-PKI-GUARD Local Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "node_core/security/node_pki_guard.py"
      - "node_core/security/node_pki_guard_x509.py"
      - "node_core/security/node_pki_guard_issuer.py"
      - "node_core/security/node_pki_guard_lifecycle.py"
      - "node_core/security/node_pki_guard_utxo.py"
      - "node_core/security/node_pki_guard_backend.py"
      - "node_core/security/backends/**"
      - "tests/test_node_pki_guard.py"
      - "tests/test_node_pki_guard_x509.py"
      - "tests/test_node_pki_guard_issuer.py"
      - "tests/test_node_pki_guard_lifecycle.py"
      - "tests/test_node_pki_guard_utxo.py"
      - "tests/test_node_pki_guard_standalone.py"
      - "schemas/node-pki-binding.schema.json"
      - "schemas/node-pki-auth-utxo.schema.json"
      - "tools/node-pki-guard-cli/**"
      - ".github/workflows/node-pki-guard-cli.yml"
      - "docs/NODE-PKI-GUARD-OPENSSL-INTEROPERABILITY.md"
      - "schemas/node-pki-certificate-bundle.schema.json"
      - "examples/node-pki-guard-bundle/manifest.example.json"
      - ".github/workflows/node-pki-guard.yml"
  push:
    branches: [main]
    paths:
      - "node_core/security/node_pki_guard.py"
      - "node_core/security/node_pki_guard_x509.py"
      - "node_core/security/node_pki_guard_issuer.py"
      - "node_core/security/node_pki_guard_utxo.py"
      - "node_core/security/node_pki_guard_backend.py"
      - "node_core/security/backends/**"
      - "tests/test_node_pki_guard.py"
      - "tests/test_node_pki_guard_x509.py"
      - "tests/test_node_pki_guard_issuer.py"
      - "tests/test_node_pki_guard_utxo.py"
      - "tests/test_node_pki_guard_standalone.py"
      - "schemas/node-pki-binding.schema.json"
      - "schemas/node-pki-auth-utxo.schema.json"
      - "tools/node-pki-guard-cli/**"
      - ".github/workflows/node-pki-guard-cli.yml"
      - ".github/workflows/node-pki-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce non-root execution
        run: |
          set -eu
          test "$(id -u)" -ne 0
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared cryptographic dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run NODE-PKI-GUARD local tests
        run: python -m unittest tests.test_node_pki_guard tests.test_node_pki_guard_x509 tests.test_node_pki_guard_issuer tests.test_node_pki_guard_lifecycle tests.test_node_pki_guard_utxo tests.test_node_pki_guard_standalone -v
      - name: Run existing NODE identity certificate tests
        run: python -m unittest tests.test_node_identity_certificate -v
      - name: Compile security modules and tests
        run: python -m compileall -q node_core/security/node_pki_guard.py node_core/security/node_pki_guard_x509.py node_core/security/node_pki_guard_issuer.py node_core/security/node_pki_guard_lifecycle.py node_core/security/node_pki_guard_utxo.py node_core/security/node_pki_guard_backend.py node_core/security/backends/standalone_sqlite.py tests/test_node_pki_guard.py tests/test_node_pki_guard_x509.py tests/test_node_pki_guard_issuer.py tests/test_node_pki_guard_utxo.py tests/test_node_pki_guard_standalone.py

  standalone-cli:
    name: Standalone CLI / Python 3.10-3.12
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    timeout-minutes: 10
    steps:
      - name: Enforce non-root execution
        run: test "$(id -u)" -ne 0
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check OpenSSL
        run: openssl version
      - name: Install standalone package without dependencies
        working-directory: tools/node-pki-guard-cli
        run: python -m pip install --no-deps .
      - name: Run isolated OpenSSL integration tests
        working-directory: tools/node-pki-guard-cli
        run: python -m unittest discover -s tests -v
      - name: Check installed CLI
        run: node-pki-guard --version
