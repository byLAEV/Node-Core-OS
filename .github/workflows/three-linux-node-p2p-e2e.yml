name: Three independent Linux nodes — Node Core P2P Contracts

on:
  push:
    branches: [main, test/three-independent-linux-nodes-p2p-e2e]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Strict user-only acceptance test. No Docker, sudo, su, apt-get, useradd, or
# root-level setup is used. Three pre-provisioned independent Linux runners are
# required, plus a private/overlay network with TCP 4001 reachable between them.
#
# Required runner labels:
#   self-hosted, linux, node-core-p2p-node-a
#   self-hosted, linux, node-core-p2p-node-b
#   self-hosted, linux, node-core-p2p-node-c
#
# Required repository Actions variables must be IPv4 addresses reachable by
# all three runners:
#   NODE_CORE_P2P_NODE_A_HOST
#   NODE_CORE_P2P_NODE_B_HOST
#   NODE_CORE_P2P_NODE_C_HOST
#
# Each runner must already have Bash, Python >= 3.10, curl, tar, sha512sum and
# timeout. The installer downloads Kubo and installs only inside that runner
# user's home directory.

jobs:
  node-a:
    name: First boot, identity and P2P Contracts on Linux system A
    uses: ./.github/workflows/three-node-user-install.yml
    with:
      node_name: node-a
      runner_label: node-core-p2p-node-a
      full_name: Synthetic QA Node A
      alias_name: qa-node-a
      document_number: TEST-DOC-A-001

  node-b:
    name: First boot, identity and P2P Contracts on Linux system B
    uses: ./.github/workflows/three-node-user-install.yml
    with:
      node_name: node-b
      runner_label: node-core-p2p-node-b
      full_name: Synthetic QA Node B
      alias_name: qa-node-b
      document_number: TEST-DOC-B-002

  node-c:
    name: First boot, identity and P2P Contracts on Linux system C
    uses: ./.github/workflows/three-node-user-install.yml
    with:
      node_name: node-c
      runner_label: node-core-p2p-node-c
      full_name: Synthetic QA Node C
      alias_name: qa-node-c
      document_number: TEST-DOC-C-003

  connect-node-a:
    name: Connect node A to B and C
    needs: [node-a, node-b, node-c]
    runs-on: [self-hosted, linux, node-core-p2p-node-a]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify both real peers from the installed Kubo daemon
        shell: bash
        env:
          NODE_CORE_P2P_NODE_B_HOST: ${{ vars.NODE_CORE_P2P_NODE_B_HOST }}
          NODE_CORE_P2P_NODE_C_HOST: ${{ vars.NODE_CORE_P2P_NODE_C_HOST }}
        run: |
          set -euo pipefail
          test -n "$NODE_CORE_P2P_NODE_B_HOST" || { echo "Missing NODE_CORE_P2P_NODE_B_HOST repository variable"; exit 1; }
          test -n "$NODE_CORE_P2P_NODE_C_HOST" || { echo "Missing NODE_CORE_P2P_NODE_C_HOST repository variable"; exit 1; }
          bash applications/p2p_contracts/tests/ci_user_connect_node.sh \
            node-a "$NODE_CORE_P2P_NODE_B_HOST" "${{ needs.node-b.outputs.peer_id }}" \
            "$NODE_CORE_P2P_NODE_C_HOST" "${{ needs.node-c.outputs.peer_id }}"

  connect-node-b:
    name: Connect node B to A and C
    needs: [node-a, node-b, node-c]
    runs-on: [self-hosted, linux, node-core-p2p-node-b]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify both real peers from the installed Kubo daemon
        shell: bash
        env:
          NODE_CORE_P2P_NODE_A_HOST: ${{ vars.NODE_CORE_P2P_NODE_A_HOST }}
          NODE_CORE_P2P_NODE_C_HOST: ${{ vars.NODE_CORE_P2P_NODE_C_HOST }}
        run: |
          set -euo pipefail
          test -n "$NODE_CORE_P2P_NODE_A_HOST" || { echo "Missing NODE_CORE_P2P_NODE_A_HOST repository variable"; exit 1; }
          test -n "$NODE_CORE_P2P_NODE_C_HOST" || { echo "Missing NODE_CORE_P2P_NODE_C_HOST repository variable"; exit 1; }
          bash applications/p2p_contracts/tests/ci_user_connect_node.sh \
            node-b "$NODE_CORE_P2P_NODE_A_HOST" "${{ needs.node-a.outputs.peer_id }}" \
            "$NODE_CORE_P2P_NODE_C_HOST" "${{ needs.node-c.outputs.peer_id }}"

  connect-node-c:
    name: Connect node C to A and B
    needs: [node-a, node-b, node-c]
    runs-on: [self-hosted, linux, node-core-p2p-node-c]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify both real peers from the installed Kubo daemon
        shell: bash
        env:
          NODE_CORE_P2P_NODE_A_HOST: ${{ vars.NODE_CORE_P2P_NODE_A_HOST }}
          NODE_CORE_P2P_NODE_B_HOST: ${{ vars.NODE_CORE_P2P_NODE_B_HOST }}
        run: |
          set -euo pipefail
          test -n "$NODE_CORE_P2P_NODE_A_HOST" || { echo "Missing NODE_CORE_P2P_NODE_A_HOST repository variable"; exit 1; }
          test -n "$NODE_CORE_P2P_NODE_B_HOST" || { echo "Missing NODE_CORE_P2P_NODE_B_HOST repository variable"; exit 1; }
          bash applications/p2p_contracts/tests/ci_user_connect_node.sh \
            node-c "$NODE_CORE_P2P_NODE_A_HOST" "${{ needs.node-a.outputs.peer_id }}" \
            "$NODE_CORE_P2P_NODE_B_HOST" "${{ needs.node-b.outputs.peer_id }}"

  p2p-contracts-real-kubo-regression:
    name: Run the shipped three-daemon P2P Contracts scenario suite as user
    needs: [connect-node-a, connect-node-b, connect-node-c]
    runs-on: [self-hosted, linux, node-core-p2p-node-a]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute P2P Contracts proposal, request, manifest, evidence and search regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0 || { echo "ERROR: runner must not be root"; exit 1; }
          export NODE_CORE_DATA_DIR="$HOME/.node-core-p2p-e2e/$GITHUB_RUN_ID/node-a"
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          test -x "$NODE_CORE_DATA_DIR/bin/ipfs"
          IPFS_BIN="$NODE_CORE_DATA_DIR/bin/ipfs" python3 applications/p2p_contracts/tests/three_node_real_kubo.py
