name: HashPaper — Python Compatibility and Security Tests

on:
  push:
    branches:
      - main
      - "test/hashpaper-professional-e2e"
    paths:
      - "applications/hashpaper/**"
      - "installer/hashpaper-update.sh"
      - "installer/tests/hashpaper-update.sh"
      - ".github/workflows/hashpaper-python-matrix.yml"
  pull_request:
    branches:
      - main
    paths:
      - "applications/hashpaper/**"
      - ".github/workflows/hashpaper-python-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract-tests:
    name: HashPaper tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test standalone HashPaper updater and data preservation
        run: |
          set -euo pipefail
          bash installer/tests/hashpaper-update.sh

      - name: Compile HashPaper sources
        run: |
          set -euo pipefail
          python -m compileall -q applications/hashpaper

      - name: Run complete HashPaper unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s applications/hashpaper/tests -v

      - name: Verify original-byte and transparent-package contract
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hashpaper-contract"
          mkdir -p "$work"
          original="$work/synthetic.md"
          package="$work/synthetic.package.json"
          python applications/hashpaper/main.py create \
            --output "$original" \
            --title "HashPaper compatibility test" \
            --text "Synthetic data only."
          before="$(sha256sum "$original" | awk '{print $1}')"
          python applications/hashpaper/main.py package \
            --input "$original" \
            --output "$package"
          after="$(sha256sum "$original" | awk '{print $1}')"
          test "$before" = "$after"
          python - "$original" "$package" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          original = Path(sys.argv[1])
          package = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          assert package["document"]["original_text"] == original.read_text(encoding="utf-8")
          assert package["document"]["sha256"] == hashlib.sha256(original.read_bytes()).hexdigest()
          assert package["encryption"]["implemented"] is False
          assert package["opentimestamps"]["status"] == "NOT_SUBMITTED"
          assert package["publication"]["ipfs_cid"] is None
          print("HashPaper original-byte, transparent-package, and unknown-state contracts passed.")
          PY
