name: Node Core OS — Personal Node Relay Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "node_core/relay_delivery.py"
      - "scripts/node_core_relay_client.py"
      - "scripts/personal_node_relay_test.py"
      - "tests/test_relay_delivery.py"
      - "tests/test_relay_client.py"
      - ".github/workflows/personal-node-relay.yml"
      - ".github/workflows/personal-node-relay-dispatch.yml"
      - "docs/PERSONAL_NODE_RELAY.md"

permissions:
  contents: read

concurrency:
  group: node-core-personal-relay-tests
  cancel-in-progress: false

jobs:
  relay-unit-tests:
    name: Relay authentication and persistence tests
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce non-root execution
        shell: bash
        run: |
          set -eu
          test "$(id -u)" -ne 0 || { echo "ERROR: this job must not run as root (UID 0)." >&2; exit 1; }
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile relay implementation
        run: python -m py_compile node_core/relay_delivery.py scripts/node_core_relay_client.py scripts/personal_node_relay_test.py tests/test_relay_delivery.py tests/test_relay_client.py

      - name: Test authentication, persistence, tamper rejection, and Ed25519 receipt
        run: python -m unittest discover -s tests -p 'test_relay_*.py' -v
