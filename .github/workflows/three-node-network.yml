name: Node Core OS — Three Kubo Nodes Mesh Integration
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/three-node-network.yml"
      - "installer/tests/three-kubo-nodes.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/three-node-network.yml"
      - "installer/tests/three-kubo-nodes.sh"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-kubo-nodes:
    name: Three independent Kubo nodes form a mesh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KUBO_VERSION: "0.43.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install test utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes curl tar
      - name: Validate shell syntax
        run: bash -n installer/tests/three-kubo-nodes.sh
      - name: Start three independent Kubo nodes and verify mesh and content transfer
        run: bash installer/tests/three-kubo-nodes.sh
