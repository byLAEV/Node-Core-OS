name: Node Core OS — Three Kubo Nodes Mesh Integration
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/three-node-network.yml"
      - "installer/tests/three-kubo-nodes.sh"
      - "installer/tests/three-node-identity-report.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/three-node-network.yml"
      - "installer/tests/three-kubo-nodes.sh"
      - "installer/tests/three-node-identity-report.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-kubo-nodes:
    name: Three independent Kubo nodes form a mesh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KUBO_VERSION: "0.43.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify test utilities are available without privilege escalation
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v curl
          command -v tar
      - name: Validate shell syntax
        run: bash -n installer/tests/three-kubo-nodes.sh
      - name: Start three independent Kubo nodes and verify mesh and content transfer
        run: bash installer/tests/three-kubo-nodes.sh
      - name: Upload three-node identity report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-node-identity-report-evidence
          path: ${{ runner.temp }}/node-core-three-node-identity-report-evidence/
          if-no-files-found: warn
          retention-days: 14
