name: Node Core OS — Installer E2E (Ubuntu 24.04 x86_64)

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-linux:
    name: Ubuntu 24.04 x86_64 installer (real install/uninstall, ${{ matrix.service_mode }})
    strategy:
      fail-fast: false
      matrix:
        service_mode: [user-systemd, no-user-systemd]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Ubuntu 24.04 x86_64 terminal contract
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test "$(uname -s)" = "Linux"
          test -n "${BASH_VERSION:-}"
          test "$(uname -m)" = "x86_64"
          test "$(id -u)" -ne 0

      - name: Make installer executable
        run: chmod +x installer/install.sh installer/uninstall.sh installer/lib/*.sh

      - name: Syntax-check installer
        run: |
          set -euo pipefail
          for script in installer/*.sh installer/lib/*.sh installer/tests/*.sh; do
            bash -n "$script"
          done

      - name: Assert installer is unprivileged and non-root
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          ! grep -R -nE '(^|[[:space:]])(sudo|apt-get|dnf|yum|pacman|zypper)([[:space:]]|$)' installer/lib installer/install.sh installer/update.sh installer/uninstall.sh

      - name: Disable user service supervisor for restricted-terminal validation
        if: matrix.service_mode == 'no-user-systemd'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/no-systemd"
          cat > "$RUNNER_TEMP/no-systemd/systemctl" <<'EOF'
          #!/usr/bin/env bash
          exit 127
          EOF
          chmod +x "$RUNNER_TEMP/no-systemd/systemctl"
          echo "$RUNNER_TEMP/no-systemd" >> "$GITHUB_PATH"

      - name: Run clean installation
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          export HOME="$(dirname "$NODE_CORE_DATA_DIR")"
          mkdir -p "$HOME"
          if ! ./installer/install.sh; then
            printf '\n--- Kubo startup log ---\n' >&2
            if [[ -f "$NODE_CORE_DATA_DIR/logs/kubo.log" ]]; then
              cat "$NODE_CORE_DATA_DIR/logs/kubo.log" >&2
            else
              printf 'Kubo log was not created.\n' >&2
            fi
            exit 1
          fi

      - name: Verify installed filesystem
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          test -x "$NODE_CORE_DATA_DIR/bin/node-core"
          test -x "$NODE_CORE_DATA_DIR/bin/ipfs"
          test -f "$NODE_CORE_DATA_DIR/config.json"
          test -f "$NODE_CORE_DATA_DIR/app/VERSION"
          cmp -s VERSION "$NODE_CORE_DATA_DIR/app/VERSION"
          test ! -e "$NODE_CORE_DATA_DIR/app/applications/hashpaper"
          test ! -e "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts"
          test ! -e "$NODE_CORE_DATA_DIR/app/installer/opentimestamps-server-install.sh"
          test ! -e "$NODE_CORE_DATA_DIR/app/docs/P2P-CONTRACTS-APPLICATION-STRUCTURE.md"
          test ! -e "$NODE_CORE_DATA_DIR/app/docs/P2P-CONTRACTS-TECHNICAL-AUDIT.md"
          test ! -e "$NODE_CORE_DATA_DIR/app/.github/workflows/three-independent-ubuntu-p2p-contracts.yml"
          test ! -e "$NODE_CORE_DATA_DIR/app/.github/workflows/three-independent-ubuntu-p2p-e2e.yml"
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' "$NODE_CORE_DATA_DIR/app/VERSION"
          test -f "$NODE_CORE_DATA_DIR/ipfs/config"
          test -d "$NODE_CORE_DATA_DIR/storage"
          test "$(id -u)" -ne 0
          test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
          test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"
          printf 'Non-root ownership verified for Node Core OS installation: %s (uid=%s).\\n' "$(id -un)" "$(id -u)"

      - name: Verify Kubo API and Node Core launcher
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          "$NODE_CORE_DATA_DIR/bin/ipfs" version
          curl --fail --silent --show-error --max-time 5 \
            -X POST http://127.0.0.1:5001/api/v0/id >/dev/null
          NODE_CORE_CONFIG="$NODE_CORE_DATA_DIR/config.json" \
            python3 -m compileall -q "$NODE_CORE_DATA_DIR/app/main.py" "$NODE_CORE_DATA_DIR/app/node_core"

      - name: Test External CID Library against the running Kubo daemon
        env:
          HOME: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
          NODE_CORE_CONFIG: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core/config.json
          PYTHONPATH: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core/app
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          test_source="$RUNNER_TEMP/external-cid-source.txt"
          test_target="$RUNNER_TEMP/external-cid-retrieved.txt"
          printf 'Node Core External CID Library live Kubo integration test.\\n' > "$test_source"
          cid="$("$NODE_CORE_DATA_DIR/bin/ipfs" add -Q --pin=false "$test_source")"
          export TEST_EXTERNAL_CID="$cid"
          export TEST_EXTERNAL_SOURCE="$test_source"
          export TEST_EXTERNAL_TARGET="$test_target"
          python3 - <<'PY'
          import os
          from pathlib import Path

          from node_core.config import NodeConfig
          from node_core.external_cids import ExternalCIDLibrary
          from node_core.ipfs import KuboManager
          from node_core.storage import StorageManager

          config = NodeConfig.load()
          storage = StorageManager(config.local_storage_path)
          storage.initialize()
          kubo = KuboManager(
              executable=config.ipfs_executable,
              repo_path=config.ipfs_repo_path,
              api=config.ipfs_api,
              profile=config.ipfs_profile,
          )
          status = kubo.status()
          assert status.running, "Kubo daemon must be running for this integration test"

          library = ExternalCIDLibrary(storage, kubo)
          cid = os.environ["TEST_EXTERNAL_CID"]
          source = Path(os.environ["TEST_EXTERNAL_SOURCE"])
          target = Path(os.environ["TEST_EXTERNAL_TARGET"])

          reference = library.add(
              cid,
              "Live Kubo integration fixture",
              source_node="local-e2e-fixture",
              notes="Created by the installer E2E workflow",
          )
          assert library.get(reference.reference_id) is not None
          assert library.search("live kubo integration fixture")
          updated = library.update(
              reference.reference_id,
              description="Updated live Kubo integration fixture",
          )
          assert updated.description == "Updated live Kubo integration fixture"

          library.retrieve(cid, target)
          assert target.read_bytes() == source.read_bytes(), "Retrieved bytes differ"

          library.pin(cid)
          assert library.is_pinned_locally(cid), "CID should be pinned after pin()"

          assert library.remove(reference.reference_id), "Reference removal failed"
          assert library.get(reference.reference_id) is None
          assert library.is_pinned_locally(cid), (
              "Removing a reference must not remove the content pin"
          )

          library.unpin(cid)
          assert not library.is_pinned_locally(cid), "CID should be unpinned after unpin()"
          print(f"External CID Library live Kubo integration passed: {cid}")
          PY

      - name: Run Node Core menu and publish test content
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          export HOME="${RUNNER_TEMP}/node-core-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SERVICE_MODE:-${{ matrix.service_mode }}}"
          test_content="$RUNNER_TEMP/node-core-e2e-content.txt"
          printf 'Node Core OS E2E content — deterministic integration test.\n' > "$test_content"
          output="$RUNNER_TEMP/node-core-menu.log"
          {
            printf '2\n'
            printf '2\n'
            printf "%s\n" "$test_content"
            printf 'y\n'
            printf '\n'
            printf '0\n'
            printf '0\n'
          } | "$NODE_CORE_DATA_DIR/bin/node-core" > "$output"
          cat "$output"
          grep -q "Node Core OS" "$output"
          grep -q "Archivo agregado" "$output"
          grep -q "CID:" "$output"
          cid="$(sed -n "s/^CID: //p" "$output" | tail -n 1)"
          [[ "$cid" =~ ^(Qm[A-Za-z1-9]+|b[a-z2-7]+)$ ]]
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          recovered="$RUNNER_TEMP/node-core-recovered.txt"
          "$NODE_CORE_DATA_DIR/bin/ipfs" cat "$cid" > "$recovered"
          printf "Original:\n"
          sha256sum "$test_content"
          printf "Recovered:\n"
          sha256sum "$recovered"
          cmp -s "$test_content" "$recovered"
          printf "Node Core E2E CID: %s\n" "$cid"

      - name: Test real updater preserves Node Core user data and excludes HashPaper
        env:
          HOME: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
          # During pull-request CI, test the real updater against this PR's candidate
          # branch, not main (which does not contain the candidate's test fixes yet).
          NODE_CORE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          app="$NODE_CORE_DATA_DIR/app"
          test -x "$NODE_CORE_DATA_DIR/bin/node-core-update"
          test -f "$app/installer/update.sh"

          # Seed legacy separate-app data and capture exact-byte digests to verify preservation.
          mkdir -p "$NODE_CORE_DATA_DIR/hashpaper/documents" \
            "$NODE_CORE_DATA_DIR/hashpaper/proofs" \
            "$NODE_CORE_DATA_DIR/hashpaper/packages" \
            "$NODE_CORE_DATA_DIR/hashpaper/records"
          printf 'synthetic upgrade preservation document\n' > "$NODE_CORE_DATA_DIR/hashpaper/documents/upgrade-preservation.md"
          printf 'synthetic OTS proof placeholder for preservation test\n' > "$NODE_CORE_DATA_DIR/hashpaper/proofs/upgrade-preservation.md.ots"
          printf '{"synthetic":"package preservation fixture"}\n' > "$NODE_CORE_DATA_DIR/hashpaper/packages/upgrade-preservation.json"
          printf '{"synthetic":"publication record preservation fixture"}\n' > "$NODE_CORE_DATA_DIR/hashpaper/records/upgrade-preservation.json"
          printf 'synthetic local storage preservation fixture\n' > "$NODE_CORE_DATA_DIR/storage/upgrade-preservation.txt"

          document_hash="$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/documents/upgrade-preservation.md" | awk '{print $1}')"
          proof_hash="$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/proofs/upgrade-preservation.md.ots" | awk '{print $1}')"
          package_hash="$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/packages/upgrade-preservation.json" | awk '{print $1}')"
          record_hash="$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/records/upgrade-preservation.json" | awk '{print $1}')"
          storage_hash="$(sha256sum "$NODE_CORE_DATA_DIR/storage/upgrade-preservation.txt" | awk '{print $1}')"
          # Create a minimal synthetic identity fixture; HashPaper-specific setup no longer runs.
          mkdir -p "$NODE_CORE_DATA_DIR/identity"
          printf '{"identity_id":"synthetic-updater-preservation"}\n' > "$NODE_CORE_DATA_DIR/identity/profile.json"
          chmod 600 "$NODE_CORE_DATA_DIR/identity/profile.json"
          identity_hash="$(sha256sum "$NODE_CORE_DATA_DIR/identity/profile.json" | awk '{print $1}')"
          config_hash="$(sha256sum "$NODE_CORE_DATA_DIR/config.json" | awk '{print $1}')"
          ipfs_config_hash="$(sha256sum "$NODE_CORE_DATA_DIR/ipfs/config" | awk '{print $1}')"
          kubo_hash="$(sha256sum "$NODE_CORE_DATA_DIR/bin/ipfs" | awk '{print $1}')"

          # Mark the installed app as an older commit so the real updater exercises
          # the download, replacement, verification, and cleanup path against main.
          printf '5858956bf88e457077ea57b7a75c2b9dac1ea897\n' > "$NODE_CORE_DATA_DIR/runtime/node-core-commit"
          printf 'y\n' | "$NODE_CORE_DATA_DIR/bin/node-core-update"

          test ! -e "$NODE_CORE_DATA_DIR/app/applications/hashpaper"
          test ! -e "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts"
          test ! -e "$NODE_CORE_DATA_DIR/app/installer/opentimestamps-server-install.sh"
          test ! -e "$NODE_CORE_DATA_DIR/app/docs/P2P-CONTRACTS-APPLICATION-STRUCTURE.md"
          test ! -e "$NODE_CORE_DATA_DIR/app/docs/P2P-CONTRACTS-TECHNICAL-AUDIT.md"
          test ! -e "$NODE_CORE_DATA_DIR/app/.github/workflows/three-independent-ubuntu-p2p-contracts.yml"
          test ! -e "$NODE_CORE_DATA_DIR/app/.github/workflows/three-independent-ubuntu-p2p-e2e.yml"
          test -x "$NODE_CORE_DATA_DIR/bin/node-core"
          test -x "$NODE_CORE_DATA_DIR/bin/node-core-update"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/documents/upgrade-preservation.md" | awk '{print $1}')" = "$document_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/proofs/upgrade-preservation.md.ots" | awk '{print $1}')" = "$proof_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/packages/upgrade-preservation.json" | awk '{print $1}')" = "$package_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/records/upgrade-preservation.json" | awk '{print $1}')" = "$record_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/storage/upgrade-preservation.txt" | awk '{print $1}')" = "$storage_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/identity/profile.json" | awk '{print $1}')" = "$identity_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/config.json" | awk '{print $1}')" = "$config_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/ipfs/config" | awk '{print $1}')" = "$ipfs_config_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/bin/ipfs" | awk '{print $1}')" = "$kubo_hash"
          test ! -e "$NODE_CORE_DATA_DIR/runtime/update/app-backup"
          test ! -e "$NODE_CORE_DATA_DIR/runtime/update/commit-marker-backup"
          test "$(cat "$NODE_CORE_DATA_DIR/runtime/node-core-commit")" != '5858956bf88e457077ea57b7a75c2b9dac1ea897'
          test "$(id -u)" -ne 0
          test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"
          printf 'Real updater preserved separate-app data, identity, config, local storage, Kubo binary and repository while excluding HashPaper from Node Core OS.\n'

      - name: Test uninstall rejects dangerous normalized paths
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          export HOME="${RUNNER_TEMP}/node-core-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SERVICE_MODE:-${{ matrix.service_mode }}}"
          marker="$HOME/node-core-uninstall-safety-marker"
          printf 'must survive uninstall safety tests\n' > "$marker"
          for dangerous in "$HOME" "$HOME/" "$HOME/." "$HOME/./" "$HOME/.." "$HOME/../"; do
            set +e
            output="$(printf "REMOVE\n" | NODE_CORE_DATA_DIR="$dangerous" ./installer/uninstall.sh 2>&1)"
            status=$?
            set -e
            test "$status" -ne 0
            grep -q "Unsafe uninstall path" <<<"$output"
            test -f "$marker"
          done
          test -d "$NODE_CORE_DATA_DIR"
      - name: Test uninstall
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          printf 'REMOVE\n' | ./installer/uninstall.sh
          test ! -e "$NODE_CORE_DATA_DIR"

  # Separate GitHub-hosted Ubuntu VMs; synthetic profiles only, never real identity data.
  # P2P Contracts E2E is suspended until Node Core OS core stability is established.
  three-independent-ubuntu-p2p-e2e:
    if: false
    name: ${{ matrix.node }} — independent Ubuntu install and P2P Contracts E2E
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: node-a
            full_name: Synthetic Person A
            alias: synthetic-node-a
            document_number: TEST-UBUNTU-A-1001
          - node: node-b
            full_name: Synthetic Person B
            alias: synthetic-node-b
            document_number: TEST-UBUNTU-B-2002
          - node: node-c
            full_name: Synthetic Person C
            alias: synthetic-node-c
            document_number: TEST-UBUNTU-C-3003
    env:
      NODE_CORE_HOME: ${{ github.workspace }}/../node-core-e2e-${{ matrix.node }}
      NODE_CORE_DATA_DIR: ${{ github.workspace }}/../node-core-e2e-${{ matrix.node }}/.node-core
      NODE_CORE_CONFIG: ${{ github.workspace }}/../node-core-e2e-${{ matrix.node }}/.node-core/config.json

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify separate Ubuntu runner and user-only execution
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          mkdir -p "$RUNNER_TEMP/node-evidence"
          printf 'node=%s\nrunner=%s\nuid=%s\nos=%s\n' \
            "${{ matrix.node }}" "$RUNNER_NAME" "$(id -u)" "$PRETTY_NAME" \
            > "$RUNNER_TEMP/node-evidence/runner.txt"

      - name: Install Node Core OS and bundled P2P Contracts from terminal
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$NODE_CORE_HOME"
          mkdir -p "$HOME"
          chmod +x installer/install.sh installer/uninstall.sh installer/lib/*.sh
          ./installer/install.sh

      - name: Verify release, Kubo daemon and non-root ownership
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$NODE_CORE_HOME"
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          test "$(id -u)" -ne 0
          test -x "$NODE_CORE_DATA_DIR/bin/node-core"
          test -x "$NODE_CORE_DATA_DIR/bin/ipfs"
          cmp -s VERSION "$NODE_CORE_DATA_DIR/app/VERSION"
          grep -qx '1.0.0' "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/VERSION"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/main.py"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/p2p_contracts/cli.py"
          "$NODE_CORE_DATA_DIR/bin/ipfs" id > "$RUNNER_TEMP/node-evidence/ipfs-id.json"
          test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
          test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"

      - name: Enter synthetic identity through Node Core BIOS and associate Kubo Peer ID
        shell: bash
        env:
          SYNTHETIC_FULL_NAME: ${{ matrix.full_name }}
          SYNTHETIC_ALIAS: ${{ matrix.alias }}
          SYNTHETIC_DOCUMENT_NUMBER: ${{ matrix.document_number }}
        run: |
          set -euo pipefail
          export HOME="$NODE_CORE_HOME"
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          python3 - "$NODE_CORE_DATA_DIR/app" <<'PY' > "$RUNNER_TEMP/node-evidence/identity-bios.txt"
          import os, sys
          from unittest.mock import patch
          sys.path.insert(0, sys.argv[1])
          from node_core.runtime import NodeRuntime

          answers = iter([
              "1", "10", "1",
              os.environ["SYNTHETIC_FULL_NAME"],
              os.environ["SYNTHETIC_ALIAS"],
              "Synthetic", "Costa Rica", "Cédula de identidad de prueba",
              os.environ["SYNTHETIC_DOCUMENT_NUMBER"],
              "1990-01-01", "170", "No especificado",
              "", "2", "", "0", "0", "0",
          ])
          def scripted_input(prompt=""):
              print(prompt, end="", flush=True)
              return next(answers)

          runtime = NodeRuntime()
          runtime.boot()
          with patch("builtins.input", side_effect=scripted_input):
              runtime.menu()
          profile = runtime.identity_profile.load()
          node = runtime.network.identity()
          assert profile is not None
          assert profile["identity_status"] == "declared"
          assert profile["full_name"] == os.environ["SYNTHETIC_FULL_NAME"]
          assert profile["alias"] == os.environ["SYNTHETIC_ALIAS"]
          assert profile["document_number"] == os.environ["SYNTHETIC_DOCUMENT_NUMBER"]
          assert profile["node_id"] == node.peer_id
          assert oct(runtime.identity_profile.profile_path.stat().st_mode & 0o777) == "0o600"
          print("BIOS identity associated with Peer ID:", node.peer_id)
          print("Synthetic identity ID:", profile["identity_id"])
          PY
          cp "$NODE_CORE_DATA_DIR/identity/profile.json" "$RUNNER_TEMP/node-evidence/profile.json"

      - name: Open P2P Contracts from Applications menu and accept local identity use
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$NODE_CORE_HOME"
          export NODE_CORE_CONFIG
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          # Use a real subprocess and stdin, because the Applications menu launches P2P Contracts as a child process.
          printf '4\n2\nyes\n0\n0\n0\n' > "$RUNNER_TEMP/p2p-input.txt"
          script -q -e -c "python3 \"$NODE_CORE_DATA_DIR/app/main.py\"" /dev/null < "$RUNNER_TEMP/p2p-input.txt" > "$RUNNER_TEMP/node-evidence/p2p-menu.txt"
          grep -Fq 'Do you accept that P2P Contracts may use your existing Node Core OS identity locally?' "$RUNNER_TEMP/node-evidence/p2p-menu.txt"
          grep -Fq '1. Create Public Request' "$RUNNER_TEMP/node-evidence/p2p-menu.txt"
          grep -Fq '3. Create Request Closure' "$RUNNER_TEMP/node-evidence/p2p-menu.txt"
          grep -Fq '4. Search Request ID' "$RUNNER_TEMP/node-evidence/p2p-menu.txt"
      - name: Test requests, validation, manifests and closure evidence
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$NODE_CORE_HOME"
          export NODE_CORE_CONFIG
          cd "$NODE_CORE_DATA_DIR/app"
          python3 -m unittest applications.p2p_contracts.tests.test_service applications.p2p_contracts.tests.test_propagation -v

      - name: Test three real Kubo daemons and P2P propagation scenarios
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$NODE_CORE_HOME"
          export NODE_CORE_CONFIG
          export IPFS_BIN="$NODE_CORE_DATA_DIR/bin/ipfs"
          cd "$NODE_CORE_DATA_DIR/app"
          python3 applications/p2p_contracts/tests/three_node_real_kubo.py -v

      - name: Upload per-node diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.node }}-ubuntu-p2p-e2e
          path: ${{ runner.temp }}/node-evidence/
          if-no-files-found: warn
          retention-days: 14

