name: Node Core OS — Installer E2E (Ubuntu 24.04 x86_64)

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-linux:
    name: Ubuntu 24.04 x86_64 installer (real install/uninstall, ${{ matrix.service_mode }})
    strategy:
      fail-fast: false
      matrix:
        service_mode: [user-systemd, no-user-systemd]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Ubuntu 24.04 x86_64 terminal contract
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test "$(uname -s)" = "Linux"
          test -n "${BASH_VERSION:-}"
          test "$(uname -m)" = "x86_64"
          test "$(id -u)" -ne 0

      - name: Make installer executable
        run: chmod +x installer/install.sh installer/uninstall.sh installer/lib/*.sh

      - name: Syntax-check installer
        run: |
          set -euo pipefail
          for script in installer/*.sh installer/lib/*.sh installer/tests/*.sh; do
            bash -n "$script"
          done

      - name: Assert installer is unprivileged and non-root
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          ! grep -R -nE '(^|[[:space:]])(sudo|apt-get|dnf|yum|pacman|zypper)([[:space:]]|$)' installer/lib installer/install.sh installer/update.sh installer/uninstall.sh

      - name: Disable user service supervisor for restricted-terminal validation
        if: matrix.service_mode == 'no-user-systemd'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/no-systemd"
          cat > "$RUNNER_TEMP/no-systemd/systemctl" <<'EOF'
          #!/usr/bin/env bash
          exit 127
          EOF
          chmod +x "$RUNNER_TEMP/no-systemd/systemctl"
          echo "$RUNNER_TEMP/no-systemd" >> "$GITHUB_PATH"

      - name: Run clean installation
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          export HOME="$(dirname "$NODE_CORE_DATA_DIR")"
          mkdir -p "$HOME"
          if ! ./installer/install.sh; then
            printf '\n--- Kubo startup log ---\n' >&2
            if [[ -f "$NODE_CORE_DATA_DIR/logs/kubo.log" ]]; then
              cat "$NODE_CORE_DATA_DIR/logs/kubo.log" >&2
            else
              printf 'Kubo log was not created.\n' >&2
            fi
            exit 1
          fi

      - name: Verify installed filesystem
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          test -x "$NODE_CORE_DATA_DIR/bin/node-core"
          test -x "$NODE_CORE_DATA_DIR/bin/ipfs"
          test -f "$NODE_CORE_DATA_DIR/config.json"
          test -f "$NODE_CORE_DATA_DIR/app/VERSION"
          cmp -s VERSION "$NODE_CORE_DATA_DIR/app/VERSION"
          test -f "$NODE_CORE_DATA_DIR/app/applications/hashpaper/VERSION"
          grep -qx '0.3.5' "$NODE_CORE_DATA_DIR/app/applications/hashpaper/VERSION"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/main.py"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/p2p_contracts/cli.py"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/tests/three_node_real_kubo.py"
          grep -qx '1.0.0' "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/VERSION"
          grep -Eq "^[0-9]+\\.[0-9]+\\.[0-9]+$" "$NODE_CORE_DATA_DIR/app/VERSION"
          test -f "$NODE_CORE_DATA_DIR/ipfs/config"
          test -d "$NODE_CORE_DATA_DIR/storage"
          test -d "$NODE_CORE_DATA_DIR/hashpaper/proofs"
          test "$(stat -c %a "$NODE_CORE_DATA_DIR/hashpaper/proofs")" = "700"
          test "$(id -u)" -ne 0
          test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
          test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"
          printf 'Non-root ownership verified for Node Core OS installation: %s (uid=%s).\\n' "$(id -un)" "$(id -u)"

      - name: Verify Kubo API and Node Core launcher
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          "$NODE_CORE_DATA_DIR/bin/ipfs" version
          curl --fail --silent --show-error --max-time 5 \
            -X POST http://127.0.0.1:5001/api/v0/id >/dev/null
          NODE_CORE_CONFIG="$NODE_CORE_DATA_DIR/config.json" \
            python3 -m compileall -q "$NODE_CORE_DATA_DIR/app/main.py" "$NODE_CORE_DATA_DIR/app/node_core"

      - name: Test installed HashPaper interactive menu
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
          launcher="$NODE_CORE_DATA_DIR/app/applications/hashpaper/main.py"
          test -f "$launcher"
          # The interactive entry point requires a real local identity profile and live Peer ID.
          NODE_CORE_CONFIG="$NODE_CORE_DATA_DIR/config.json" python3 - "$NODE_CORE_DATA_DIR/app" <<'PY'
          import sys
          sys.path.insert(0, sys.argv[1])
          from node_core.runtime import NodeRuntime

          runtime = NodeRuntime()
          runtime.boot()
          profile = runtime.identity_profile.save_declared_profile(
              full_name="Synthetic HashPaper Menu Test",
              alias="hashpaper-menu-e2e",
              nationality="Synthetic",
              issuing_country="ZZ",
              document_type="TEST",
              document_number="SYNTHETIC-MENU-NOT-A-REAL-ID",
              birth_date="2000-01-01",
              height_cm=170,
              gender="not-specified",
          )
          assert profile["identity_status"] == "declared"
          status = runtime.kubo.status()
          assert status.running and status.peer_id
          print("Synthetic identity and live Peer ID ready for consent-gated menu test.")
          PY
          output="$(printf 'ACCEPT IDENTITY DATA USE\n0\n' | NODE_CORE_CONFIG="$NODE_CORE_DATA_DIR/config.json" python3 "$launcher")"
          printf '%s\n' "$output"
          grep -Fq "IDENTITY DATA USE — REQUIRED TO ENTER HASHPAPER" <<< "$output"
          grep -Fq "Identity data use accepted for this session." <<< "$output"
          grep -Fq "HashPaper for Node Core OS" <<< "$output"
          grep -Fq "1. Create document + send to OpenTimestamps" <<< "$output"
          grep -Fq "2. Send selected document to OpenTimestamps" <<< "$output"
          grep -Fq "5. Send selected document copy to IPFS" <<< "$output"
          grep -Fq "6. IPFS publication history and gateways" <<< "$output"
          grep -Fq "8. Build transparent JSON package (advanced)" <<< "$output"
          grep -Fq "9. Publish existing transparent package (advanced)" <<< "$output"
          grep -Fq "0. Exit" <<< "$output"
          printf 'Installed HashPaper consent-gated interactive menu test passed.\n'

      - name: Test HashPaper package publication against live Kubo
        env:
          HOME: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
          NODE_CORE_CONFIG: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core/config.json
          PYTHONPATH: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core/app
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          documents="$NODE_CORE_DATA_DIR/hashpaper/documents"
          packages="$NODE_CORE_DATA_DIR/hashpaper/packages"
          records="$NODE_CORE_DATA_DIR/hashpaper/records"
          mkdir -p "$documents" "$packages" "$records"
          original="$documents/hashpaper-live-kubo-e2e-001.md"
          package="$packages/hashpaper-live-kubo-e2e-001.json"
          receipt="$records/hashpaper-live-kubo-e2e-001.publication.json"

          python3 "$NODE_CORE_DATA_DIR/app/applications/hashpaper/main.py" create \
            --output "$original" \
            --title "Synthetic HashPaper live Kubo test" \
            --text "Synthetic content for the Node Core OS HashPaper integration test."
          python3 "$NODE_CORE_DATA_DIR/app/applications/hashpaper/main.py" package \
            --input "$original" \
            --output "$package"

          python3 - "$original" "$package" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          original = Path(sys.argv[1])
          package_path = Path(sys.argv[2])
          original_bytes = original.read_bytes()
          package = json.loads(package_path.read_text(encoding="utf-8"))
          assert package["document"]["original_text"] == original_bytes.decode("utf-8")
          assert package["document"]["sha256"] == hashlib.sha256(original_bytes).hexdigest()
          assert package["encryption"]["implemented"] is False
          assert package["opentimestamps"]["status"] == "NOT_SUBMITTED"
          print("HashPaper original-byte hash and full-text package checks passed.")
          PY

          printf 'PUBLISH\n' | python3 "$NODE_CORE_DATA_DIR/app/applications/hashpaper/main.py" publish \
            --input "$package" \
            --report "$receipt"

          python3 - "$receipt" "$package" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          package = Path(sys.argv[2]).read_bytes()
          assert receipt["publication_status"] == "PUBLISHED_AND_RETRIEVED"
          assert receipt["content_verified"] is True
          assert receipt["pinned"] is True
          assert receipt["published"] is True
          assert receipt["sha256"] == hashlib.sha256(package).hexdigest()
          print("HashPaper live Kubo publication receipt checks passed.")
          print(f"HashPaper live Kubo CID: {receipt['cid']}")
          PY

          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          cid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["cid"])' "$receipt")"
          recovered="$RUNNER_TEMP/hashpaper-live-kubo-recovered.json"
          "$NODE_CORE_DATA_DIR/bin/ipfs" cat "$cid" > "$recovered"
          cmp -s "$package" "$recovered"
          printf "HashPaper live Kubo CID byte-for-byte retrieval passed: %s\n" "$cid"

      - name: Test HashPaper live identity and Peer ID association
        env:
          HOME: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
          NODE_CORE_CONFIG: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core/config.json
          PYTHONPATH: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core/app
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          documents="$NODE_CORE_DATA_DIR/hashpaper/documents"
          packages="$NODE_CORE_DATA_DIR/hashpaper/packages"
          mkdir -p "$documents" "$packages"
          original="$documents/hashpaper-live-identity-e2e-001.md"
          package="$packages/hashpaper-live-identity-e2e-001.json"

          python3 - "$NODE_CORE_DATA_DIR/app" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, sys.argv[1])
          from node_core.runtime import NodeRuntime

          runtime = NodeRuntime()
          runtime.boot()
          profile = runtime.identity_profile.save_declared_profile(
              full_name="Synthetic HashPaper Test Identity",
              alias="hashpaper-e2e",
              nationality="Synthetic",
              issuing_country="ZZ",
              document_type="TEST",
              document_number="SYNTHETIC-NOT-A-REAL-DOCUMENT",
              birth_date="2000-01-01",
              height_cm=170,
              gender="not-specified",
          )
          assert profile["identity_status"] == "declared"
          # Profile creation must not be coupled to root privileges or to a
          # pre-existing association. The package flow below verifies association
          # with the actual Peer ID returned by Node Core OS Kubo.
          status = runtime.kubo.status()
          assert status.running and status.peer_id, "Kubo must provide a live Peer ID for this test"
          print("Synthetic local identity profile created; live Kubo Peer ID is available.")
          PY

          printf 'Synthetic content for live HashPaper identity association.\n' > "$original"
          printf 'INCLUDE IDENTITY AND NODE\n' | python3 "$NODE_CORE_DATA_DIR/app/applications/hashpaper/main.py" package \
            --input "$original" \
            --output "$package" \
            --use-node-profile

          python3 - "$NODE_CORE_DATA_DIR/app" "$original" "$package" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, sys.argv[1])
          from node_core.runtime import NodeRuntime

          original = Path(sys.argv[2]).read_bytes()
          package = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          runtime = NodeRuntime()
          profile = runtime.identity_profile.load()
          status = runtime.kubo.status()
          assert status.running and status.peer_id
          assert profile["node_id"] == status.peer_id
          assert package["node"]["peer_id"] == status.peer_id
          assert package["identity"]["fields"]["full_name"] == "Synthetic HashPaper Test Identity"
          assert package["identity"]["fields"]["document_number"] == "SYNTHETIC-NOT-A-REAL-DOCUMENT"
          assert package["document"]["original_text"] == original.decode("utf-8")
          assert package["document"]["sha256"] == hashlib.sha256(original).hexdigest()
          assert package["encryption"]["implemented"] is False
          print(f"HashPaper live identity association verified against Kubo Peer ID: {status.peer_id}")
          print("Synthetic identity, complete original text, and exact-byte SHA-256 checks passed.")
          PY

      - name: Test External CID Library against the running Kubo daemon
        env:
          HOME: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
          NODE_CORE_CONFIG: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core/config.json
          PYTHONPATH: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core/app
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          test_source="$RUNNER_TEMP/external-cid-source.txt"
          test_target="$RUNNER_TEMP/external-cid-retrieved.txt"
          printf 'Node Core External CID Library live Kubo integration test.\\n' > "$test_source"
          cid="$("$NODE_CORE_DATA_DIR/bin/ipfs" add -Q --pin=false "$test_source")"
          export TEST_EXTERNAL_CID="$cid"
          export TEST_EXTERNAL_SOURCE="$test_source"
          export TEST_EXTERNAL_TARGET="$test_target"
          python3 - <<'PY'
          import os
          from pathlib import Path

          from node_core.config import NodeConfig
          from node_core.external_cids import ExternalCIDLibrary
          from node_core.ipfs import KuboManager
          from node_core.storage import StorageManager

          config = NodeConfig.load()
          storage = StorageManager(config.local_storage_path)
          storage.initialize()
          kubo = KuboManager(
              executable=config.ipfs_executable,
              repo_path=config.ipfs_repo_path,
              api=config.ipfs_api,
              profile=config.ipfs_profile,
          )
          status = kubo.status()
          assert status.running, "Kubo daemon must be running for this integration test"

          library = ExternalCIDLibrary(storage, kubo)
          cid = os.environ["TEST_EXTERNAL_CID"]
          source = Path(os.environ["TEST_EXTERNAL_SOURCE"])
          target = Path(os.environ["TEST_EXTERNAL_TARGET"])

          reference = library.add(
              cid,
              "Live Kubo integration fixture",
              source_node="local-e2e-fixture",
              notes="Created by the installer E2E workflow",
          )
          assert library.get(reference.reference_id) is not None
          assert library.search("live kubo integration fixture")
          updated = library.update(
              reference.reference_id,
              description="Updated live Kubo integration fixture",
          )
          assert updated.description == "Updated live Kubo integration fixture"

          library.retrieve(cid, target)
          assert target.read_bytes() == source.read_bytes(), "Retrieved bytes differ"

          library.pin(cid)
          assert library.is_pinned_locally(cid), "CID should be pinned after pin()"

          assert library.remove(reference.reference_id), "Reference removal failed"
          assert library.get(reference.reference_id) is None
          assert library.is_pinned_locally(cid), (
              "Removing a reference must not remove the content pin"
          )

          library.unpin(cid)
          assert not library.is_pinned_locally(cid), "CID should be unpinned after unpin()"
          print(f"External CID Library live Kubo integration passed: {cid}")
          PY

      - name: Run Node Core menu and publish test content
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          export HOME="${RUNNER_TEMP}/node-core-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SERVICE_MODE:-${{ matrix.service_mode }}}"
          test_content="$RUNNER_TEMP/node-core-e2e-content.txt"
          printf 'Node Core OS E2E content — deterministic integration test.\n' > "$test_content"
          output="$RUNNER_TEMP/node-core-menu.log"
          {
            printf '2\n'
            printf '2\n'
            printf "%s\n" "$test_content"
            printf 'y\n'
            printf '\n'
            printf '0\n'
            printf '0\n'
          } | "$NODE_CORE_DATA_DIR/bin/node-core" > "$output"
          cat "$output"
          grep -q "Node Core OS" "$output"
          grep -q "Archivo agregado" "$output"
          grep -q "CID:" "$output"
          cid="$(sed -n "s/^CID: //p" "$output" | tail -n 1)"
          [[ "$cid" =~ ^(Qm[A-Za-z1-9]+|b[a-z2-7]+)$ ]]
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          recovered="$RUNNER_TEMP/node-core-recovered.txt"
          "$NODE_CORE_DATA_DIR/bin/ipfs" cat "$cid" > "$recovered"
          printf "Original:\n"
          sha256sum "$test_content"
          printf "Recovered:\n"
          sha256sum "$recovered"
          cmp -s "$test_content" "$recovered"
          printf "Node Core E2E CID: %s\n" "$cid"

      - name: Test real updater preserves installed HashPaper and user data
        env:
          HOME: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
          # During pull-request CI, test the real updater against this PR's candidate
          # branch, not main (which does not contain the candidate's test fixes yet).
          NODE_CORE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          app="$NODE_CORE_DATA_DIR/app"
          test -x "$NODE_CORE_DATA_DIR/bin/node-core-update"
          test -f "$app/installer/update.sh"

          # Seed persistent synthetic HashPaper data and capture exact-byte digests.
          mkdir -p "$NODE_CORE_DATA_DIR/hashpaper/documents" \
            "$NODE_CORE_DATA_DIR/hashpaper/proofs" \
            "$NODE_CORE_DATA_DIR/hashpaper/packages" \
            "$NODE_CORE_DATA_DIR/hashpaper/records"
          printf 'synthetic upgrade preservation document\n' > "$NODE_CORE_DATA_DIR/hashpaper/documents/upgrade-preservation.md"
          printf 'synthetic OTS proof placeholder for preservation test\n' > "$NODE_CORE_DATA_DIR/hashpaper/proofs/upgrade-preservation.md.ots"
          printf '{"synthetic":"package preservation fixture"}\n' > "$NODE_CORE_DATA_DIR/hashpaper/packages/upgrade-preservation.json"
          printf '{"synthetic":"publication record preservation fixture"}\n' > "$NODE_CORE_DATA_DIR/hashpaper/records/upgrade-preservation.json"
          printf 'synthetic local storage preservation fixture\n' > "$NODE_CORE_DATA_DIR/storage/upgrade-preservation.txt"

          document_hash="$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/documents/upgrade-preservation.md" | awk '{print $1}')"
          proof_hash="$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/proofs/upgrade-preservation.md.ots" | awk '{print $1}')"
          package_hash="$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/packages/upgrade-preservation.json" | awk '{print $1}')"
          record_hash="$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/records/upgrade-preservation.json" | awk '{print $1}')"
          storage_hash="$(sha256sum "$NODE_CORE_DATA_DIR/storage/upgrade-preservation.txt" | awk '{print $1}')"
          identity_hash="$(sha256sum "$NODE_CORE_DATA_DIR/identity/profile.json" | awk '{print $1}')"
          config_hash="$(sha256sum "$NODE_CORE_DATA_DIR/config.json" | awk '{print $1}')"
          ipfs_config_hash="$(sha256sum "$NODE_CORE_DATA_DIR/ipfs/config" | awk '{print $1}')"
          kubo_hash="$(sha256sum "$NODE_CORE_DATA_DIR/bin/ipfs" | awk '{print $1}')"

          # Mark the installed app as an older commit so the real updater exercises
          # the download, replacement, verification, and cleanup path against main.
          printf '5858956bf88e457077ea57b7a75c2b9dac1ea897\n' > "$NODE_CORE_DATA_DIR/runtime/node-core-commit"
          printf 'y\n' | "$NODE_CORE_DATA_DIR/bin/node-core-update"

          test -f "$NODE_CORE_DATA_DIR/app/applications/hashpaper/main.py"
          test -x "$NODE_CORE_DATA_DIR/bin/node-core"
          test -x "$NODE_CORE_DATA_DIR/bin/node-core-update"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/documents/upgrade-preservation.md" | awk '{print $1}')" = "$document_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/proofs/upgrade-preservation.md.ots" | awk '{print $1}')" = "$proof_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/packages/upgrade-preservation.json" | awk '{print $1}')" = "$package_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/hashpaper/records/upgrade-preservation.json" | awk '{print $1}')" = "$record_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/storage/upgrade-preservation.txt" | awk '{print $1}')" = "$storage_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/identity/profile.json" | awk '{print $1}')" = "$identity_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/config.json" | awk '{print $1}')" = "$config_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/ipfs/config" | awk '{print $1}')" = "$ipfs_config_hash"
          test "$(sha256sum "$NODE_CORE_DATA_DIR/bin/ipfs" | awk '{print $1}')" = "$kubo_hash"
          test ! -e "$NODE_CORE_DATA_DIR/runtime/update/app-backup"
          test ! -e "$NODE_CORE_DATA_DIR/runtime/update/commit-marker-backup"
          test "$(cat "$NODE_CORE_DATA_DIR/runtime/node-core-commit")" != '5858956bf88e457077ea57b7a75c2b9dac1ea897'
          test "$(id -u)" -ne 0
          test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"
          printf 'Real updater preserved HashPaper documents, proofs, packages, records, identity, config, local storage, Kubo binary and repository.\n'

      - name: Test uninstall rejects dangerous normalized paths
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          export HOME="${RUNNER_TEMP}/node-core-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SERVICE_MODE:-${{ matrix.service_mode }}}"
          marker="$HOME/node-core-uninstall-safety-marker"
          printf 'must survive uninstall safety tests\n' > "$marker"
          for dangerous in "$HOME" "$HOME/" "$HOME/." "$HOME/./" "$HOME/.." "$HOME/../"; do
            set +e
            output="$(printf "REMOVE\n" | NODE_CORE_DATA_DIR="$dangerous" ./installer/uninstall.sh 2>&1)"
            status=$?
            set -e
            test "$status" -ne 0
            grep -q "Unsafe uninstall path" <<<"$output"
            test -f "$marker"
          done
          test -d "$NODE_CORE_DATA_DIR"
      - name: Test uninstall
        env:
          NODE_CORE_DATA_DIR: ${{ runner.temp }}/node-core-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service_mode }}/.node-core
        run: |
          set -euo pipefail
          printf 'REMOVE\n' | ./installer/uninstall.sh
          test ! -e "$NODE_CORE_DATA_DIR"


  three-independent-p2p-nodes:
    name: Independent Ubuntu 24.04 node \${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [node-a, node-b, node-c]
    env:
      HOME: \${{ runner.temp }}/p2p-\${{ matrix.node }}-\${{ github.run_id }}
      NODE_CORE_DATA_DIR: \${{ runner.temp }}/p2p-\${{ matrix.node }}-\${{ github.run_id }}/.node-core
      NODE_CORE_CONFIG: \${{ runner.temp }}/p2p-\${{ matrix.node }}-\${{ github.run_id }}/.node-core/config.json
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify this is a separate Ubuntu VM and never root
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = "24.04"
          test "$(uname -s)" = Linux
          test "$(id -u)" -ne 0
          mkdir -p "$HOME"
          printf 'Node: %s\nHostname: %s\nUID: %s\n' \
            "\${{ matrix.node }}" "$(hostname)" "$(id -u)" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate installer scripts are user-only
        run: |
          set -euo pipefail
          for script in installer/*.sh installer/lib/*.sh installer/tests/*.sh; do
            bash -n "$script"
          done
          ! grep -R -nE '(^|[[:space:]])(sudo|su|apt-get|dnf|yum|pacman|zypper)([[:space:]]|$)' \
            installer/install.sh installer/lib installer/update.sh installer/uninstall.sh
          chmod +x installer/install.sh installer/uninstall.sh installer/lib/*.sh

      - name: Install Node Core OS and bundled P2P Contracts as normal user
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          ./installer/install.sh

      - name: Verify versions, private ownership and bundled application
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          grep -qx '1.3.0' "$NODE_CORE_DATA_DIR/app/VERSION"
          grep -qx '1.0.0' "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/VERSION"
          test -x "$NODE_CORE_DATA_DIR/bin/ipfs"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/main.py"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/p2p_contracts/cli.py"
          test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
          test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"

      - name: Restart Kubo daemon explicitly as user in a separate terminal-like session
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          "$NODE_CORE_DATA_DIR/bin/ipfs" shutdown || true
          mkdir -p "$NODE_CORE_DATA_DIR/logs" "$NODE_CORE_DATA_DIR/runtime"
          nohup "$NODE_CORE_DATA_DIR/bin/ipfs" daemon \
            > "$NODE_CORE_DATA_DIR/logs/kubo-explicit-daemon.log" 2>&1 </dev/null &
          daemon_pid=$!
          printf '%s\n' "$daemon_pid" > "$NODE_CORE_DATA_DIR/runtime/p2p-test-daemon.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 \
              -X POST http://127.0.0.1:5001/api/v0/id >/dev/null 2>&1; then
              "$NODE_CORE_DATA_DIR/bin/ipfs" id
              exit 0
            fi
            if ! kill -0 "$daemon_pid" 2>/dev/null; then
              cat "$NODE_CORE_DATA_DIR/logs/kubo-explicit-daemon.log" >&2
              exit 1
            fi
            sleep 1
          done
          cat "$NODE_CORE_DATA_DIR/logs/kubo-explicit-daemon.log" >&2
          exit 1

      - name: Create distinct synthetic identity and associate it with this Kubo Peer ID
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 - "$NODE_CORE_DATA_DIR/app" "\${{ matrix.node }}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, sys.argv[1])
          from node_core.runtime import NodeRuntime

          node_name = sys.argv[2]
          runtime = NodeRuntime()
          runtime.boot()
          peer = runtime.network.identity()
          assert peer.peer_id, "Kubo Peer ID missing"
          profile = runtime.identity_profile.save_declared_profile(
              full_name=f"Synthetic Test Person {node_name.upper()}",
              alias=f"synthetic-{node_name}",
              nationality="Synthetic",
              issuing_country="ZZ",
              document_type="TEST-ID",
              document_number=f"TEST-{node_name.upper()}-20261012",
              birth_date="1990-01-01",
              height_cm=170,
              gender="not-specified",
          )
          profile = runtime.identity_profile.associate_node(peer.peer_id)
          assert profile["identity_status"] == "declared"
          assert profile["node_id"] == peer.peer_id
          path = runtime.identity_profile.profile_path
          assert path.stat().st_uid == os.getuid()
          assert path.stat().st_mode & 0o077 == 0
          summary = {
              "node": node_name,
              "identity_id": profile["identity_id"],
              "peer_id": peer.peer_id,
              "identity_status": profile["identity_status"],
              "profile_mode": oct(path.stat().st_mode & 0o777),
              "uid": os.getuid(),
          }
          out = Path(os.environ["RUNNER_TEMP"]) / f"{node_name}-identity-summary.json"
          out.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Open P2P Contracts and verify identity consent and menu
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          app="$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/main.py"
          output="$(printf 'y\n0\n' | python3 "$app")"
          printf '%s\n' "$output"
          grep -Fq 'NODE CORE OS — P2P CONTRACTS' <<< "$output"
          grep -Fq 'Do you accept that P2P Contracts may use your existing Node Core OS identity locally?' <<< "$output"
          grep -Fq '1. Create Public Request' <<< "$output"
          grep -Fq '2. Create Private Request (not available yet)' <<< "$output"
          grep -Fq '3. Create Request Closure' <<< "$output"
          grep -Fq '4. Search Request ID' <<< "$output"
          grep -Fq '0. Exit P2P Contracts' <<< "$output"

      - name: Run P2P Contracts unit tests as user
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          cd "$NODE_CORE_DATA_DIR/app"
          python3 -m unittest \
            applications.p2p_contracts.tests.test_service \
            applications.p2p_contracts.tests.test_propagation -v

      - name: Run real-Kubo three-daemon application scenarios as user
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          cd "$NODE_CORE_DATA_DIR/app"
          IPFS_BIN="$NODE_CORE_DATA_DIR/bin/ipfs" \
            python3 applications/p2p_contracts/tests/three_node_real_kubo.py -v

      - name: Verify user-only permissions and upload non-sensitive node summary
        if: always()
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          if [[ -d "$NODE_CORE_DATA_DIR" ]]; then
            test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
            test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"
            if [[ -f "$NODE_CORE_DATA_DIR/identity/profile.json" ]]; then
              test "$(stat -c %a "$NODE_CORE_DATA_DIR/identity/profile.json")" = 600
            fi
          fi

      - name: Upload synthetic identity association summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: \${{ matrix.node }}-p2p-identity-summary
          path: \${{ runner.temp }}/\${{ matrix.node }}-identity-summary.json
          if-no-files-found: warn
