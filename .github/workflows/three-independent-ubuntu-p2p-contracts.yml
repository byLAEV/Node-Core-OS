name: Three independent Ubuntu nodes — Node Core OS + P2P Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [test/three-ubuntu-p2p-contracts-independent-install-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-test-node:
    name: Ubuntu 24.04 independent node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [node-a, node-b, node-c]
    env:
      HOME: ${{ github.workspace }}/.node-core-home-${{ matrix.node }}
      NODE_CORE_DATA_DIR: ${{ github.workspace }}/.node-core-home-${{ matrix.node }}/.node-core
      NODE_CORE_CONFIG: ${{ github.workspace }}/.node-core-home-${{ matrix.node }}/.node-core/config.json
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Node Core OS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify isolated Ubuntu runner and user-only execution
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = "24.04"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          printf 'node=%s\nrunner=%s\nuid=%s\nhostname=%s\n' \
            "${{ matrix.node }}" "$RUNNER_NAME" "$(id -u)" "$(hostname)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check installer scripts without privileged commands
        run: |
          set -euo pipefail
          for script in installer/*.sh installer/lib/*.sh installer/tests/*.sh; do
            bash -n "$script"
          done
          ! grep -R -nE '(^|[[:space:]])(sudo|su|apt-get|dnf|yum|pacman|zypper)([[:space:]]|$)' \
            installer/install.sh installer/lib installer/update.sh installer/uninstall.sh

      - name: Install Node Core OS 1.3.0 as the current user
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          mkdir -p "$HOME"
          chmod +x installer/install.sh installer/uninstall.sh installer/lib/*.sh
          ./installer/install.sh

      - name: Verify installed Node Core OS and P2P Contracts versions and ownership
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -x "$NODE_CORE_DATA_DIR/bin/node-core"
          test -x "$NODE_CORE_DATA_DIR/bin/ipfs"
          test -f "$NODE_CORE_DATA_DIR/app/VERSION"
          grep -qx '1.3.0' "$NODE_CORE_DATA_DIR/app/VERSION"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/VERSION"
          grep -qx '1.0.0' "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/VERSION"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/main.py"
          test -f "$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/p2p_contracts/cli.py"
          test -f "$NODE_CORE_DATA_DIR/ipfs/config"
          test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
          test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"
          printf 'Node Core OS 1.3.0 and P2P Contracts 1.0.0 installed as uid=%s.\n' "$(id -u)"

      - name: Verify Kubo daemon is running in this user's installation
        run: |
          set -euo pipefail
          export IPFS_PATH="$NODE_CORE_DATA_DIR/ipfs"
          "$NODE_CORE_DATA_DIR/bin/ipfs" version
          curl --fail --silent --show-error --max-time 5 \
            -X POST http://127.0.0.1:5001/api/v0/id >/dev/null
          "$NODE_CORE_DATA_DIR/bin/ipfs" id
          test "$(id -u)" -ne 0

      - name: Create distinct synthetic identity and associate it with this Kubo Peer ID
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 - "$NODE_CORE_DATA_DIR/app" "${{ matrix.node }}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          app_root = Path(sys.argv[1])
          node_name = sys.argv[2]
          sys.path.insert(0, str(app_root))
          from node_core.runtime import NodeRuntime

          runtime = NodeRuntime()
          runtime.boot()
          peer = runtime.kubo.status()
          assert peer.running and peer.peer_id, "Kubo must be online before identity association"
          profile = runtime.identity_profile.save_declared_profile(
              full_name=f"Synthetic Test Person {node_name.upper()}",
              alias=f"synthetic-{node_name}",
              nationality="Synthetic",
              issuing_country="ZZ",
              document_type="TEST-ID",
              document_number=f"TEST-{node_name.upper()}-20261012",
              birth_date="1990-01-01",
              height_cm=170,
              gender="not-specified",
          )
          profile = runtime.identity_profile.associate_node(peer.peer_id)
          assert profile["identity_status"] == "declared"
          assert profile["node_id"] == peer.peer_id
          path = runtime.identity_profile.profile_path
          assert (path.stat().st_mode & 0o077) == 0, oct(path.stat().st_mode & 0o777)
          assert path.stat().st_uid == os.getuid()
          summary = {
              "node": node_name,
              "identity_id": profile["identity_id"],
              "peer_id": peer.peer_id,
              "identity_status": profile["identity_status"],
              "profile_mode": oct(path.stat().st_mode & 0o777),
              "uid": os.getuid(),
          }
          result = Path(os.environ["RUNNER_TEMP"]) / f"{node_name}-identity-check.json"
          result.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Open P2P Contracts menu and verify identity consent gate
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          app="$NODE_CORE_DATA_DIR/app/applications/p2p_contracts/main.py"
          output="$(printf 'y\n0\n' | python3 "$app")"
          printf '%s\n' "$output"
          grep -Fq 'NODE CORE OS — P2P CONTRACTS' <<< "$output"
          grep -Fq 'Do you accept that P2P Contracts may use your existing Node Core OS identity locally?' <<< "$output"
          grep -Fq '1. Create Public Request' <<< "$output"
          grep -Fq '2. Create Private Request (disabled' <<< "$output" || grep -Fq '2. Create Private Request (not available yet)' <<< "$output"
          grep -Fq '3. Create Request Closure' <<< "$output"
          grep -Fq '4. Search Request ID' <<< "$output"

      - name: Run P2P Contracts unit tests
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          cd "$NODE_CORE_DATA_DIR/app"
          python3 -m unittest \
            applications.p2p_contracts.tests.test_service \
            applications.p2p_contracts.tests.test_propagation -v

      - name: Run real-Kubo three-daemon functional scenarios on this Ubuntu
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          cd "$NODE_CORE_DATA_DIR/app"
          IPFS_BIN="$NODE_CORE_DATA_DIR/bin/ipfs" \
            python3 applications/p2p_contracts/tests/three_node_real_kubo.py -v

      - name: Verify profile and installed tree remain user-owned
        if: always()
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          if [[ -d "$NODE_CORE_DATA_DIR" ]]; then
            test "$(stat -c %u "$NODE_CORE_DATA_DIR")" = "$(id -u)"
            test -z "$(find "$NODE_CORE_DATA_DIR" -xdev -uid 0 -print -quit)"
            if [[ -f "$NODE_CORE_DATA_DIR/identity/profile.json" ]]; then
              test "$(stat -c %a "$NODE_CORE_DATA_DIR/identity/profile.json")" = 600
            fi
          fi

      - name: Upload synthetic node verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.node }}-verification
          path: ${{ runner.temp }}/${{ matrix.node }}-identity-check.json
          if-no-files-found: warn
